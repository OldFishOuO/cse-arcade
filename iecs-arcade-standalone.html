<script>
/* ===== assets/js/core.js ===== */
/* ============================================================
   core.js — DOM 工具 / 儲存 / 設定 / 音效 / 提示 / 遊戲註冊表
   刻意不使用 ES module，讓 index.html 直接雙擊（file://）也能跑
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE = window.CSE || {};

  /* ---------------- 小工具 ---------------- */
  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function pad(n, w) { var s = String(n); while (s.length < w) s = '0' + s; return s; }
  function nf(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  CSE.util = {
    randInt: randInt, pick: pick, shuffle: shuffle,
    clamp: clamp, pad: pad, nf: nf,
    /* 以毫秒為單位的 mm:ss */
    mmss: function (sec) {
      sec = Math.max(0, Math.floor(sec));
      return pad(Math.floor(sec / 60), 1) + ':' + pad(sec % 60, 2);
    }
  };

  /* ---------------- DOM ---------------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (k === 'html') n.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') {
          for (var s in v) {
            if (!Object.prototype.hasOwnProperty.call(v, s)) continue;
            /* CSS 自訂屬性（--xxx）只能用 setProperty，直接指派 style['--x'] 沒有效果 */
            if (s.charCodeAt(0) === 45 && s.charCodeAt(1) === 45) n.style.setProperty(s, v[s]);
            else n.style[s] = v[s];
          }
        } else if (k === 'dataset') {
          for (var d in v) { if (Object.prototype.hasOwnProperty.call(v, d)) n.dataset[d] = v[d]; }
        } else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
          n.addEventListener(k.slice(2), v);
        } else {
          n.setAttribute(k, v === true ? '' : v);
        }
      }
    }
    if (kids !== null && kids !== undefined) append(n, kids);
    return n;
  }
  function append(parent, kids) {
    if (Array.isArray(kids)) {
      for (var i = 0; i < kids.length; i++) append(parent, kids[i]);
    } else if (kids instanceof Node) {
      parent.appendChild(kids);
    } else if (kids !== null && kids !== undefined && kids !== false) {
      parent.appendChild(document.createTextNode(String(kids)));
    }
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'text') n.textContent = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v);
      }
    }
    return n;
  }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function corners() {
    return [
      el('i', { class: 'corner tl' }), el('i', { class: 'corner tr' }),
      el('i', { class: 'corner bl' }), el('i', { class: 'corner br' })
    ];
  }

  /* ---------------- 儲存（localStorage + 記憶體後援） ---------------- */
  var PREFIX = 'cse.v1.';
  var memStore = {};
  var lsOK = (function () {
    try {
      var t = PREFIX + '__probe';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return true;
    } catch (e) { return false; }
  })();

  CSE.store = {
    ok: lsOK,
    get: function (key, def) {
      try {
        var raw = lsOK ? window.localStorage.getItem(PREFIX + key) : memStore[key];
        if (raw === null || raw === undefined) return def;
        return JSON.parse(raw);
      } catch (e) { return def; }
    },
    set: function (key, val) {
      try {
        var raw = JSON.stringify(val);
        if (lsOK) window.localStorage.setItem(PREFIX + key, raw);
        else memStore[key] = raw;
        return true;
      } catch (e) { return false; }
    },
    del: function (key) {
      try {
        if (lsOK) window.localStorage.removeItem(PREFIX + key);
        else delete memStore[key];
      } catch (e) { /* ignore */ }
    },
    keys: function () {
      try {
        if (!lsOK) return Object.keys(memStore);
        var out = [];
        for (var i = 0; i < window.localStorage.length; i++) {
          var k = window.localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) out.push(k.slice(PREFIX.length));
        }
        return out;
      } catch (e) { return []; }
    },
    clearAll: function () {
      var self = this;
      this.keys().forEach(function (k) { self.del(k); });
      memStore = {};
    }
  };

  /* ---------------- 設定 ---------------- */
  var DEFAULTS = { sound: true, motion: true, scanline: true, kiosk: false, idle: 75 };

  CSE.settings = {
    _v: null,
    all: function () {
      if (!this._v) {
        var saved = CSE.store.get('settings', {}) || {};
        this._v = {};
        for (var k in DEFAULTS) {
          if (!Object.prototype.hasOwnProperty.call(DEFAULTS, k)) continue;
          this._v[k] = (saved[k] === undefined) ? DEFAULTS[k] : saved[k];
        }
      }
      return this._v;
    },
    get: function (k) { return this.all()[k]; },
    set: function (k, v) {
      this.all()[k] = v;
      CSE.store.set('settings', this._v);
      this.apply();
      if (typeof this.onchange === 'function') this.onchange(k, v);
    },
    toggle: function (k) { this.set(k, !this.get(k)); return this.get(k); },
    apply: function () {
      var v = this.all();
      var r = document.documentElement;
      r.dataset.motion = v.motion ? 'on' : 'off';
      r.dataset.scanline = v.scanline ? 'on' : 'off';
      var b = document.getElementById('btnSound');
      if (b) b.setAttribute('aria-pressed', v.sound ? 'true' : 'false');
    },
    onchange: null
  };

  /* ---------------- 音效（Web Audio，無外部檔案） ---------------- */
  var actx = null;
  var audioBlocked = false;

  function ctx() {
    if (audioBlocked) return null;
    if (actx) return actx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { audioBlocked = true; return null; }
      actx = new AC();
    } catch (e) { audioBlocked = true; return null; }
    return actx;
  }

  function tone(freq, dur, type, vol, delay, slideTo) {
    var c = ctx();
    if (!c) return;
    try {
      var t0 = c.currentTime + (delay || 0);
      var osc = c.createOscillator();
      var g = c.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol === undefined ? 0.07 : vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (e) { /* ignore */ }
  }

  var SOUNDS = {
    click: function () { tone(520, 0.045, 'square', 0.045); },
    type:  function () { tone(880, 0.02, 'square', 0.02); },
    tick:  function () { tone(1400, 0.03, 'sine', 0.035); },
    ok:    function () { tone(660, 0.08, 'triangle', 0.07); tone(990, 0.1, 'triangle', 0.06, 0.07); },
    great: function () { tone(660, 0.07, 'triangle', 0.07); tone(880, 0.07, 'triangle', 0.07, 0.06); tone(1320, 0.14, 'triangle', 0.06, 0.12); },
    bad:   function () { tone(200, 0.18, 'sawtooth', 0.055, 0, 90); },
    win:   function () { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.16, 'triangle', 0.065, i * 0.1); }); },
    over:  function () { [392, 330, 262].forEach(function (f, i) { tone(f, 0.22, 'triangle', 0.06, i * 0.14); }); }
  };

  CSE.sfx = {
    /* 必須在第一次使用者互動時呼叫，否則瀏覽器會擋住音訊 */
    unlock: function () {
      var c = ctx();
      if (c && c.state === 'suspended') { try { c.resume(); } catch (e) { /* ignore */ } }
    },
    play: function (name) {
      if (!CSE.settings.get('sound')) return;
      var fn = SOUNDS[name];
      if (fn) { this.unlock(); fn(); }
    }
  };

  /* ---------------- Toast ---------------- */
  CSE.toast = function (msg, kind, ms) {
    var box = document.getElementById('toasts');
    if (!box) return;
    var t = el('div', { class: 'toast' + (kind ? ' ' + kind : ''), text: msg });
    box.appendChild(t);
    var life = ms || 2200;
    setTimeout(function () {
      t.style.transition = 'opacity .25s';
      t.style.opacity = '0';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 260);
    }, life);
  };

  /* ---------------- Modal ---------------- */
  CSE.modal = function (opts) {
    opts = opts || {};
    var host = document.getElementById('modals');
    var dialog = el('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true' });
    var back = el('div', { class: 'backdrop' }, dialog);

    if (opts.accent) dialog.style.setProperty('--accent', opts.accent);
    if (opts.title) dialog.appendChild(el('h2', { text: opts.title }));
    if (opts.body) append(dialog, opts.body);

    function close() {
      document.removeEventListener('keydown', onKey, true);
      if (back.parentNode) back.parentNode.removeChild(back);
      if (typeof opts.onClose === 'function') opts.onClose();
    }
    function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } }

    var actions = opts.actions || [{ label: '關閉' }];
    var bar = el('div', { class: 'row', style: { marginTop: '16px', justifyContent: 'flex-end' } });
    actions.forEach(function (a) {
      bar.appendChild(el('button', {
        type: 'button',
        class: 'btn' + (a.primary ? ' btn--primary' : '') + (a.danger ? ' btn--danger' : ''),
        text: a.label,
        onclick: function () {
          CSE.sfx.play('click');
          var keep = a.onClick && a.onClick();
          if (!keep) close();
        }
      }));
    });
    dialog.appendChild(bar);

    back.addEventListener('click', function (e) { if (e.target === back && !opts.sticky) close(); });
    document.addEventListener('keydown', onKey, true);
    host.appendChild(back);

    var focusTarget = dialog.querySelector('input, button.btn--primary, button');
    if (focusTarget) setTimeout(function () { focusTarget.focus(); }, 30);

    return { close: close, dialog: dialog };
  };

  CSE.confirm = function (title, msg, onYes, yesLabel) {
    CSE.modal({
      title: title,
      body: el('p', { class: 'muted', text: msg }),
      actions: [
        { label: yesLabel || '確定', primary: true, danger: true, onClick: onYes },
        { label: '取消' }
      ]
    });
  };

  /* ---------------- 遊戲註冊表 ---------------- */
  CSE.games = [];
  CSE.gameById = {};
  CSE.registerGame = function (def) {
    if (!def || !def.id || typeof def.mount !== 'function') {
      console.error('[CSE] 遊戲註冊失敗，缺少 id 或 mount：', def);
      return;
    }
    if (CSE.gameById[def.id]) {
      console.warn('[CSE] 重複的遊戲 id：' + def.id);
      return;
    }
    def.duration = def.duration || 0;
    def.medals = def.medals || { bronze: 400, silver: 900, gold: 1600 };
    CSE.games.push(def);
    CSE.gameById[def.id] = def;
  };

  CSE.ui = {
    el: el, svg: svgEl, append: append, clear: clear, esc: esc, corners: corners
  };
})();

</script>
<script>
/* ===== assets/js/scores.js ===== */
/* ============================================================
   scores.js — 排行榜 / 個人最佳 / 徽章 / 資料匯出
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;
  var store = CSE.store;

  var MAX_ROWS = 60;          /* 每款遊戲保留的排行榜筆數 */
  var NAME_MAX = 10;

  /* 暱稱清理：去控制字元、限制長度、擋空白與少數髒字 */
  var BLOCK = ['幹', '靠北', 'fuck', 'shit', 'bitch', 'dick', '婊', '賤'];
  function cleanName(raw) {
    var s = String(raw === null || raw === undefined ? '' : raw);
    /* 移除控制字元與方向覆寫字元（避免排行榜被排版攻擊） */
    s = s.replace(/[\u0000-\u001F\u007F​-‏‪-‮⁠-⁯]/g, '');
    s = s.replace(/\s+/g, ' ').trim();
    if (!s) return '';
    if (s.length > NAME_MAX) s = s.slice(0, NAME_MAX);
    var low = s.toLowerCase();
    for (var i = 0; i < BLOCK.length; i++) {
      if (low.indexOf(BLOCK[i]) >= 0) return '';
    }
    return s;
  }

  function lbKey(gameId) { return 'lb.' + gameId; }
  function statKey(gameId) { return 'stat.' + gameId; }

  var Scores = {
    nameMax: NAME_MAX,
    cleanName: cleanName,

    /* ---- 排行榜 ---- */
    top: function (gameId, n) {
      var rows = store.get(lbKey(gameId), []) || [];
      if (!Array.isArray(rows)) rows = [];
      return rows.slice(0, n || MAX_ROWS);
    },
    submit: function (gameId, name, score, stats) {
      var nm = cleanName(name);
      if (!nm) return { ok: false, reason: 'name' };
      var rows = store.get(lbKey(gameId), []) || [];
      if (!Array.isArray(rows)) rows = [];
      var entry = { n: nm, s: Math.round(score), t: Date.now(), m: stats || null };
      rows.push(entry);
      rows.sort(function (a, b) { return (b.s - a.s) || (a.t - b.t); });
      rows = rows.slice(0, MAX_ROWS);
      store.set(lbKey(gameId), rows);
      store.set('lastName', nm);
      var rank = rows.indexOf(entry) + 1;
      return { ok: true, rank: rank, total: rows.length };
    },
    lastName: function () { return store.get('lastName', '') || ''; },

    /* ---- 個人紀錄（不需暱稱，自動累計） ---- */
    recordResult: function (gameId, score) {
      var st = store.get(statKey(gameId), { best: 0, plays: 0, sum: 0 }) || {};
      st.best = Math.max(st.best || 0, Math.round(score));
      st.plays = (st.plays || 0) + 1;
      st.sum = (st.sum || 0) + Math.round(score);
      store.set(statKey(gameId), st);
      return st;
    },
    stat: function (gameId) {
      return store.get(statKey(gameId), { best: 0, plays: 0, sum: 0 }) || { best: 0, plays: 0, sum: 0 };
    },
    best: function (gameId) { return this.stat(gameId).best || 0; },
    plays: function (gameId) { return this.stat(gameId).plays || 0; },

    /* 總分 = 每款遊戲的最佳分數加總（鼓勵把七款都玩過） */
    total: function () {
      var self = this, sum = 0;
      CSE.games.forEach(function (g) { sum += self.best(g.id); });
      return sum;
    },
    totalPlays: function () {
      var self = this, sum = 0;
      CSE.games.forEach(function (g) { sum += self.plays(g.id); });
      return sum;
    },

    /* ---- 獎牌 / 徽章 ---- */
    medalOf: function (gameId, score) {
      var g = CSE.gameById[gameId];
      if (!g) return null;
      var m = g.medals;
      if (score >= m.gold) return 'gold';
      if (score >= m.silver) return 'silver';
      if (score >= m.bronze) return 'bronze';
      return null;
    },
    medalIcon: function (medal) {
      return medal === 'gold' ? '🥇' : medal === 'silver' ? '🥈' : medal === 'bronze' ? '🥉' : '';
    },
    rankTitle: function (gameId, score) {
      var m = this.medalOf(gameId, score);
      var g = CSE.gameById[gameId];
      var titles = (g && g.titles) || ['體驗組', '新手上路', '熟練工程師', '系上傳說'];
      return m === 'gold' ? titles[3] : m === 'silver' ? titles[2] : m === 'bronze' ? titles[1] : titles[0];
    },

    badges: function () {
      var self = this;
      var out = [];
      CSE.games.forEach(function (g) {
        var best = self.best(g.id);
        var medal = self.medalOf(g.id, best);
        out.push({
          id: 'g.' + g.id,
          icon: medal ? self.medalIcon(medal) : '▢',
          name: g.name,
          note: medal
            ? self.rankTitle(g.id, best) + '（' + CSE.util.nf(best) + ' 分）'
            : (best > 0 ? '還差 ' + CSE.util.nf(g.medals.bronze - best) + ' 分拿銅牌' : '尚未挑戰'),
          got: !!medal
        });
      });

      var playedAll = CSE.games.every(function (g) { return self.plays(g.id) > 0; });
      var allBronze = CSE.games.every(function (g) { return self.medalOf(g.id, self.best(g.id)); });
      var allGold = CSE.games.every(function (g) { return self.medalOf(g.id, self.best(g.id)) === 'gold'; });
      var total = self.total();
      var th = (CSE.config.prize && CSE.config.prize.threshold) || 3000;

      out.push({ id: 'meta.all', icon: '🎒', name: '全系通識', note: '七款遊戲都玩過一次', got: playedAll });
      out.push({ id: 'meta.bronze', icon: '🔧', name: '修完必修', note: '每款至少拿到銅牌', got: allBronze });
      out.push({ id: 'meta.prize', icon: '🎁', name: '兌換資格', note: '總分達 ' + CSE.util.nf(th) + ' 分', got: total >= th });
      out.push({ id: 'meta.gold', icon: '👑', name: '系主任認證', note: '每款都拿到金牌', got: allGold });
      return out;
    },

    /* ---- 資料匯出 ---- */
    exportCsv: function () {
      var rows = [['game_id', 'game_name', 'rank', 'nickname', 'score', 'time_iso']];
      var self = this;
      CSE.games.forEach(function (g) {
        self.top(g.id).forEach(function (r, i) {
          rows.push([g.id, g.name, i + 1, r.n, r.s, new Date(r.t).toISOString()]);
        });
      });
      var csv = rows.map(function (r) {
        return r.map(function (c) {
          var s = String(c);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',');
      }).join('\r\n');
      /* BOM：讓 Excel 正確讀中文 */
      return '﻿' + csv;
    },
    summary: function () {
      var self = this;
      return CSE.games.map(function (g) {
        var rows = self.top(g.id);
        return {
          id: g.id, name: g.name,
          plays: self.plays(g.id),
          entries: rows.length,
          best: rows.length ? rows[0].s : 0,
          avg: rows.length ? Math.round(rows.reduce(function (s, r) { return s + r.s; }, 0) / rows.length) : 0
        };
      });
    },
    resetAll: function () { store.clearAll(); CSE.settings._v = null; }
  };

  CSE.scores = Scores;

  /* 下載檔案（file:// 與 http:// 都可用） */
  CSE.download = function (filename, text, mime) {
    try {
      var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 150);
      return true;
    } catch (e) {
      CSE.toast('這個瀏覽器無法下載檔案', 'bad');
      return false;
    }
  };
})();

</script>
<script>
/* ===== assets/js/host.js ===== */
/* ============================================================
   host.js — 遊戲外框：準備畫面 / 計時 / 計分 / 結果畫面 / 資源回收
   所有遊戲共用同一套生命週期，避免每款遊戲各自漏清計時器。
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;
  var ui = CSE.ui, el = ui.el;

  var current = null;      /* 目前執行中的 instance */

  var Host = {
    busy: false,           /* true = 正在遊戲中（閒置重置不會打斷） */

    stop: function () {
      if (current) { current._destroy(); current = null; }
      this.busy = false;
    },

    start: function (def, mountEl) {
      this.stop();
      current = createInstance(def, mountEl);
      return current;
    }
  };

  function createInstance(def, mountEl) {
    /* ---------- 狀態 ---------- */
    var S = {
      score: 0,
      left: def.duration || 0,
      running: false,
      ended: false,
      cleanups: [],
      rafId: 0,
      extra: null
    };

    /* ---------- 外框 DOM ---------- */
    var scoreB = el('b', { text: '0' });
    var timeB = el('b', { text: def.duration ? String(def.duration) : '—' });
    var timeBox = el('div', { class: 'statbox time' }, [el('span', { text: '時間' }), timeB]);
    var scoreBox = el('div', { class: 'statbox score' }, [el('span', { text: '分數' }), scoreB]);
    var extraSpan = el('span', { text: '' });
    var extraB = el('b', { text: '' });
    var extraBox = el('div', { class: 'statbox hidden' }, [extraSpan, extraB]);

    var stage = el('div', { class: 'gf-stage' });
    var hint = el('div', { class: 'gf-hint' });
    var body = el('div', { style: { flex: '1', display: 'flex', flexDirection: 'column', minHeight: '0' } });
    stage.appendChild(hint);
    stage.appendChild(body);

    var btnRestart = el('button', { type: 'button', class: 'btn btn--sm', text: '重來' });
    var btnHow = el('button', { type: 'button', class: 'btn btn--sm', text: '玩法' });
    var btnHome = el('button', { type: 'button', class: 'btn btn--sm', text: '離開' });

    var frame = el('div', { class: 'gframe' }, [
      el('div', { class: 'gf-top' }, [
        el('div', { class: 'gf-id' }, [
          el('b', { text: def.name }),
          el('span', { text: def.tag || '' })
        ]),
        el('div', { class: 'gf-stats' }, [timeBox, scoreBox, extraBox]),
        el('div', { class: 'gf-actions' }, [btnRestart, btnHow, btnHome])
      ]),
      stage
    ]);

    frame.style.setProperty('--accent', def.accent || 'var(--green)');
    if (!def.duration) timeBox.classList.add('hidden');

    ui.clear(mountEl);
    mountEl.appendChild(frame);

    btnHow.addEventListener('click', function () {
      CSE.sfx.play('click');
      CSE.modal({
        title: '玩法：' + def.name,
        accent: def.accent,
        body: [
          el('ol', { class: 'howto' }, (def.how || []).map(function (t) { return el('li', { text: t }); })),
          def.controls ? el('p', { class: 'faint', style: { fontSize: '12.5px' }, text: '操作：' + def.controls }) : null
        ]
      });
    });
    btnRestart.addEventListener('click', function () {
      CSE.sfx.play('click');
      begin();
    });
    btnHome.addEventListener('click', function () {
      CSE.sfx.play('click');
      location.hash = '#/';
    });

    /* ---------- 給遊戲用的 API ---------- */
    var api = {
      def: def,
      stage: body,
      el: el,
      svg: ui.svg,
      sfx: CSE.sfx,
      util: CSE.util,

      get score() { return S.score; },

      setScore: function (n) {
        S.score = Math.max(0, Math.round(n));
        scoreB.textContent = CSE.util.nf(S.score);
        return S.score;
      },
      addScore: function (n) { return api.setScore(S.score + n); },

      hint: function (text, kind) {
        hint.textContent = text || '';
        hint.className = 'gf-hint' + (kind ? ' ' + kind : '');
      },

      /* 第三個計分欄（連擊、關卡、剩餘生命…） */
      setStat: function (label, value) {
        if (label === null) { extraBox.classList.add('hidden'); return; }
        extraBox.classList.remove('hidden');
        extraSpan.textContent = label;
        extraB.textContent = String(value);
      },

      timeLeft: function () { return S.left; },
      addTime: function (sec) {
        S.left = Math.max(0, S.left + sec);
        paintTime();
      },

      /* 自動清理的事件監聽 */
      on: function (target, type, fn, opts) {
        target.addEventListener(type, fn, opts);
        S.cleanups.push(function () { target.removeEventListener(type, fn, opts); });
      },
      after: function (ms, fn) {
        var id = setTimeout(function () { if (!S.ended) fn(); }, ms);
        S.cleanups.push(function () { clearTimeout(id); });
        return id;
      },
      every: function (ms, fn) {
        var id = setInterval(function () { if (!S.ended) fn(); }, ms);
        S.cleanups.push(function () { clearInterval(id); });
        return id;
      },
      onDestroy: function (fn) { S.cleanups.push(fn); },

      /* 註冊「結算資料提供者」：時間到時 host 會呼叫它拿 stats / knowledge。
         這樣遊戲不必自己攔截時間到的時機。 */
      onResult: function (fn) { S.resultFn = fn; },

      /* 暫停倒數：遊戲開場需要先讓玩家選東西（例如選程式語言）時用。
         選完呼叫 holdTimer(false) 再開始計時，不會吃掉玩家的時間。 */
      holdTimer: function (on) {
        S.held = !!on;
        if (!S.held) S.lastTick = Date.now();
        timeBox.classList.toggle('warn', false);
      },

      restart: function () { begin(); },

      /* 結束一局 */
      finish: function (result) { endGame(result || {}); }
    };

    /* ---------- 計時 ----------
       用「真實時鐘」而不是 requestAnimationFrame 的幀差。

       原因：視窗被別的程式蓋住、最小化、或系統省電時，
       瀏覽器可能完全不產生畫面，rAF 一幀都不跑，
       但 document.hidden 仍然是 false（頁面自認看得見）。
       如果計時靠 rAF，這種情況下時鐘會停住、整局永遠不會結束。

       所以倒數改由 setInterval + Date.now() 推動；
       rAF 只留給動畫（api 的 onFrame），停了也只是畫面不動而已。

       切到別的分頁要暫停是刻意保留的行為，
       但改成明確監聽 visibilitychange，而不是依賴 rAF 的副作用。 ---------- */
    var TICK_MS = 200;

    function paintTime() {
      if (!def.duration) return;
      var s = Math.ceil(S.left);
      timeB.textContent = String(s);
      timeBox.classList.toggle('warn', s <= 10 && S.running);
    }

    /* 真實時鐘推動的倒數 + 給遊戲用的 onTick */
    function clockTick() {
      if (S.ended || !S.running) return;
      var now = Date.now();
      var dt = (now - S.lastTick) / 1000;
      S.lastTick = now;
      if (dt <= 0) return;
      dt = Math.min(dt, 1.0);            /* 卡頓時一次最多算 1 秒，不要瞬間扣光 */

      if (def.duration) {
        var before = Math.ceil(S.left);
        S.left -= dt;
        if (S.left <= 0) {
          S.left = 0;
          paintTime();
          endGame({ reason: 'timeout' });
          return;
        }
        var after = Math.ceil(S.left);
        if (after !== before) {
          paintTime();
          if (after <= 5) CSE.sfx.play('tick');
        }
      }
      if (S.tickFn) {
        try { S.tickFn(dt); } catch (e) { console.error('[CSE] onTick 失敗', e); }
      }
    }

    /* 切走 / 切回：暫停與續跑 */
    function onVisibility() {
      if (document.hidden) {
        S.paused = true;
      } else if (S.paused) {
        S.paused = false;
        S.lastTick = Date.now();         /* 丟掉離開期間的時間 */
      }
    }
    document.addEventListener('visibilitychange', onVisibility);

    /* rAF 只負責動畫，跑不動也不影響遊戲進行 */
    function frameLoop() {
      if (S.ended || !S.running) return;
      S.rafId = requestAnimationFrame(frameLoop);
      if (!S.onFrame || S.paused || S.held) return;
      var now = Date.now();
      var dt = Math.min(0.1, (now - S.lastFrame) / 1000);
      S.lastFrame = now;
      if (dt > 0) S.onFrame(dt);
    }

    /* ---------- 準備畫面 ---------- */
    var readyOverlay = null;

    function showReady() {
      Host.busy = false;
      S.running = false;
      S.ended = false;
      var best = CSE.scores.best(def.id);
      readyOverlay = el('div', { class: 'overlay' }, [
        el('div', { class: 'kicker', text: def.tag || 'MINI GAME' }),
        el('h2', { text: def.name }),
        el('p', { class: 'muted', style: { maxWidth: '46ch' }, text: def.blurb }),
        el('ol', { class: 'howto' }, (def.how || []).map(function (t) { return el('li', { text: t }); })),
        def.controls ? el('p', { class: 'faint', style: { fontSize: '12.5px' }, text: '操作：' + def.controls }) : null,
        el('div', { class: 'row', style: { justifyContent: 'center' } }, [
          el('button', {
            type: 'button', class: 'btn btn--primary btn--lg', text: '開始遊戲',
            onclick: function () { CSE.sfx.unlock(); CSE.sfx.play('ok'); begin(); }
          })
        ]),
        el('div', { class: 'faint', style: { fontSize: '12px' } },
          def.duration ? ('一局 ' + def.duration + ' 秒' + (best ? '　·　你的最佳：' + CSE.util.nf(best) + ' 分' : ''))
            : (best ? '你的最佳：' + CSE.util.nf(best) + ' 分' : ''))
      ]);
      stage.appendChild(readyOverlay);
    }

    /* ---------- 開始一局 ---------- */
    function begin() {
      runCleanups();
      S.score = 0; S.left = def.duration || 0;
      S.ended = false; S.running = true; S.onFrame = null;
      S.resultFn = null; S.tickFn = null; S.held = false;
      S.paused = document.hidden;
      api.setScore(0);
      api.setStat(null);
      api.hint('');
      paintTime();
      ui.clear(body);
      body.removeAttribute('inert');
      removeOverlays();
      Host.busy = true;

      var r;
      try {
        r = def.mount(body, api);
      } catch (e) {
        console.error('[CSE] ' + def.id + ' 啟動失敗', e);
        api.hint('這款遊戲載入失敗了，請按「重來」或回首頁。', 'bad');
        Host.busy = false;
        return;
      }
      if (r && typeof r.onFrame === 'function') S.onFrame = r.onFrame;
      if (r && typeof r.onTick === 'function') S.tickFn = r.onTick;
      if (r && typeof r.destroy === 'function') S.cleanups.push(r.destroy);

      S.lastTick = S.lastFrame = Date.now();
      clearInterval(S.tickId);
      S.tickId = setInterval(function () { if (!S.paused && !S.held) clockTick(); }, TICK_MS);
      cancelAnimationFrame(S.rafId);
      S.rafId = requestAnimationFrame(frameLoop);
    }

    /* ---------- 結束一局 ---------- */
    function endGame(result) {
      if (S.ended) return;
      S.ended = true;
      S.running = false;
      Host.busy = false;
      cancelAnimationFrame(S.rafId);
      clearInterval(S.tickId);

      /* 結果畫面蓋上後，底下的遊戲元件不能再被點擊或用 Tab 聚焦 */
      try { body.setAttribute('inert', ''); } catch (e) { /* ignore */ }

      /* 讓遊戲補上自己的結算統計 */
      if (S.resultFn) {
        try {
          var extra = S.resultFn() || {};
          if (!result.stats && extra.stats) result.stats = extra.stats;
          if (!result.knowledge && extra.knowledge) result.knowledge = extra.knowledge;
        } catch (e) { console.warn('[CSE] onResult 失敗', e); }
      }

      var score = S.score;
      var prevBest = CSE.scores.best(def.id);
      CSE.scores.recordResult(def.id, score);
      var isPB = score > prevBest && score > 0;

      CSE.sfx.play(score >= def.medals.silver ? 'win' : 'over');
      if (typeof Host.onFinish === 'function') Host.onFinish(def.id, score);

      showResult(score, prevBest, isPB, result);
    }

    function showResult(score, prevBest, isPB, result) {
      var medal = CSE.scores.medalOf(def.id, score);
      var title = CSE.scores.rankTitle(def.id, score);
      var stats = result.stats || [];
      var know = result.knowledge || def.knowledge;

      var nameInput = el('input', {
        type: 'text', maxlength: String(CSE.scores.nameMax),
        placeholder: '暱稱（最多 ' + CSE.scores.nameMax + ' 字）',
        value: CSE.scores.lastName(),
        autocomplete: 'off', spellcheck: 'false'
      });
      var submitRow = el('div', { class: 'namebox' });
      var submitMsg = el('div', { class: 'faint', style: { fontSize: '12px', minHeight: '1.4em' } });

      function doSubmit() {
        var res = CSE.scores.submit(def.id, nameInput.value, score,
          stats.map(function (s) { return s.k + '=' + s.v; }).join('; '));
        if (!res.ok) {
          submitMsg.textContent = '請輸入 1–' + CSE.scores.nameMax + ' 個字的暱稱（避免不雅字）';
          submitMsg.className = 'bad';
          nameInput.focus();
          return;
        }
        CSE.sfx.play('great');
        ui.clear(submitRow);
        submitRow.appendChild(el('div', { class: 'tag', text: '已登錄排行榜　第 ' + res.rank + ' 名' }));
        submitRow.appendChild(el('a', { class: 'btn btn--sm', href: '#/board?g=' + def.id, text: '看排行榜' }));
        submitMsg.textContent = '';
      }

      var btnSubmit = el('button', { type: 'button', class: 'btn btn--primary', text: '登錄排行榜', onclick: doSubmit });
      submitRow.appendChild(nameInput);
      submitRow.appendChild(btnSubmit);
      nameInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doSubmit(); }
      });

      var others = CSE.games.filter(function (g) { return g.id !== def.id; });
      var next = others.length ? CSE.util.pick(others) : null;

      var ov = el('div', { class: 'overlay' }, [
        el('div', { class: 'kicker', text: result.reason === 'cleared' ? '全部通關' : '時間到' }),
        el('div', { class: 'bigscore', text: CSE.util.nf(score) }),
        el('div', { class: 'rank-title', text: (medal ? CSE.scores.medalIcon(medal) + ' ' : '') + title }),
        isPB ? el('div', { class: 'tag', text: '★ 個人新紀錄！前一次最佳 ' + CSE.util.nf(prevBest) }) : null,
        stats.length ? el('div', { class: 'statlist' }, stats.map(function (s) {
          return el('div', {}, [s.k, el('b', { text: String(s.v) })]);
        })) : null,
        know ? el('div', { class: 'know' }, [
          el('h3', { text: '▸ ' + (know.title || '小知識') }),
          el('ul', {}, (know.lines || []).map(function (t) { return el('li', { text: t }); }))
        ]) : null,
        el('div', { class: 'divider' }),
        submitRow,
        submitMsg,
        el('div', { class: 'row', style: { justifyContent: 'center' } }, [
          el('button', { type: 'button', class: 'btn btn--primary', text: '再玩一次', onclick: function () { CSE.sfx.play('click'); begin(); } }),
          next ? el('a', { class: 'btn', href: '#/g/' + next.id, text: '下一款：' + next.name } ) : null,
          el('a', { class: 'btn btn--ghost', href: '#/', text: '回首頁' })
        ])
      ]);
      stage.appendChild(ov);
    }

    function removeOverlays() {
      var list = stage.querySelectorAll('.overlay');
      for (var i = 0; i < list.length; i++) list[i].parentNode.removeChild(list[i]);
      readyOverlay = null;
    }

    function runCleanups() {
      var list = S.cleanups;
      S.cleanups = [];
      for (var i = 0; i < list.length; i++) {
        try { list[i](); } catch (e) { console.warn('[CSE] cleanup 失敗', e); }
      }
    }

    /* ---------- 銷毀 ---------- */
    function destroy() {
      S.ended = true;
      S.running = false;
      Host.busy = false;
      cancelAnimationFrame(S.rafId);
      clearInterval(S.tickId);
      document.removeEventListener('visibilitychange', onVisibility);
      runCleanups();
      ui.clear(mountEl);
    }

    showReady();

    return {
      api: api,
      begin: begin,
      _destroy: destroy
    };
  }

  CSE.host = Host;
})();

</script>
<script>
/* ===== assets/js/games/binary.js ===== */
/* ============================================================
   遊戲 1：二進位快打 — 撥 8 個位元開關湊出目標十進位數
   教的是：位值、2 的次方、1 byte = 8 bits
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;

  var WEIGHTS = [128, 64, 32, 16, 8, 4, 2, 1];

  CSE.registerGame({
    id: 'binary',
    name: '二進位快打',
    tag: '數位邏輯 · BINARY',
    icon: '10',
    accent: 'var(--green)',
    blurb: '電腦眼裡只有 0 和 1。撥動 8 個位元開關，湊出畫面上的十進位數字。',
    how: [
      '上方出現一個目標數字（1–255）。',
      '點下方 8 個開關，讓「目前數值」等於目標。',
      '數值一相符就自動跳下一題，連續答對有連擊加成。',
      '不會算就按「提示」看答案的二進位，但該題分數砍半。'
    ],
    controls: '滑鼠點擊或手指觸控；也可按鍵盤 1–8 切換第 1–8 個開關',
    duration: 60,
    medals: { bronze: 600, silver: 1300, gold: 2200 },
    titles: ['體驗組', '二進位新生', '位元快手', '人類 CPU'],
    knowledge: {
      title: '為什麼是 8 個開關？',
      lines: [
        '8 個位元 = 1 byte，剛好能表示 0–255，共 256 種狀態。',
        '每個位元的「權重」是 2 的次方：128、64、32、16、8、4、2、1。',
        '一個英文字元（ASCII）就是 1 byte；你剛剛其實是在手動編碼。',
        '顏色 #FF8800 裡的 FF 就是 255，也就是 8 個位元全部打開。'
      ]
    },

    mount: function (stage, api) {
      var bits = [0, 0, 0, 0, 0, 0, 0, 0];
      var target = 0;
      var streak = 0, solved = 0, skipped = 0, hintsUsed = 0;
      var qStart = 0, hintOn = false, qIndex = 0;

      var numEl = api.el('div', { class: 'num', text: '0' });
      var curVal = api.el('b', { text: '0' });
      var curBin = api.el('span', { class: 'faint', text: '' });
      var curEl = api.el('div', { class: 'bin-cur' }, ['目前：', curVal, ' ', curBin]);
      var binHint = api.el('div', { class: 'bin-binary', text: '' });

      var bitsWrap = api.el('div', { class: 'bin-bits' });
      var bitBtns = [];

      WEIGHTS.forEach(function (w, i) {
        var vEl = api.el('div', { class: 'v', text: '0' });
        var b = api.el('button', {
          type: 'button', class: 'bit', 'aria-pressed': 'false',
          'aria-label': '位元 ' + (i + 1) + '，權重 ' + w
        }, [vEl, api.el('div', { class: 'w', text: String(w) })]);
        b._v = vEl;
        b.addEventListener('click', function () { toggle(i); });
        bitBtns.push(b);
        bitsWrap.appendChild(b);
      });

      var btnHint = api.el('button', {
        type: 'button', class: 'btn btn--sm', text: '提示（分數砍半）',
        onclick: function () {
          if (hintOn) return;
          hintOn = true; hintsUsed++;
          api.sfx.play('click');
          paintHint();
        }
      });
      var btnSkip = api.el('button', {
        type: 'button', class: 'btn btn--sm', text: '跳過（−20）',
        onclick: function () {
          skipped++;
          streak = 0;
          api.setStat('連擊', 0);     /* 不補這行的話畫面會停在舊的連擊數 */
          api.addScore(-20);
          api.sfx.play('bad');
          api.hint('跳過了，連擊歸零。', 'bad');
          nextQuestion();
        }
      });
      var btnClear = api.el('button', {
        type: 'button', class: 'btn btn--sm', text: '全部歸零',
        onclick: function () {
          for (var i = 0; i < 8; i++) bits[i] = 0;
          api.sfx.play('click');
          paint();
        }
      });

      stage.appendChild(api.el('div', { class: 'bin-wrap' }, [
        api.el('div', { class: 'bin-target' }, [
          api.el('div', { class: 'lbl', text: '目標數字' }),
          numEl
        ]),
        binHint,
        bitsWrap,
        curEl,
        api.el('div', { class: 'bin-hintrow' }, [btnHint, btnSkip, btnClear])
      ]));

      function value() {
        var v = 0;
        for (var i = 0; i < 8; i++) if (bits[i]) v += WEIGHTS[i];
        return v;
      }

      function binStr(v) {
        var s = '';
        for (var i = 0; i < 8; i++) s += ((v >> (7 - i)) & 1);
        return s;
      }

      function paintHint() {
        binHint.textContent = hintOn ? binStr(target) : '';
      }

      function paint() {
        var v = value();
        curVal.textContent = String(v);
        curBin.textContent = '(' + binStr(v) + ')';
        curEl.className = 'bin-cur' + (v > target ? ' hi' : v < target ? ' lo' : '');
        for (var i = 0; i < 8; i++) {
          bitBtns[i].setAttribute('aria-pressed', bits[i] ? 'true' : 'false');
          bitBtns[i]._v.textContent = bits[i] ? '1' : '0';
        }
        if (v === target) win();
      }

      function toggle(i) {
        bits[i] = bits[i] ? 0 : 1;
        api.sfx.play('click');
        paint();
      }

      function win() {
        solved++;
        streak++;
        var elapsed = (performance.now() - qStart) / 1000;
        var speed = Math.max(0, Math.round((6 - elapsed) * 12));   /* 6 秒內有加成 */
        var base = 60 + 12 * Math.min(streak - 1, 8);
        var gain = Math.round((base + speed) * (hintOn ? 0.5 : 1));
        api.addScore(gain);
        api.setStat('連擊', streak);
        api.sfx.play(streak >= 4 ? 'great' : 'ok');
        api.hint('正確！+' + gain + ' 分' + (streak > 1 ? '（' + streak + ' 連擊）' : '') +
          '　' + target + ' = ' + binStr(target), 'good');
        nextQuestion();
      }

      function nextQuestion() {
        qIndex++;
        hintOn = false;
        paintHint();
        /* 前三題給小數字當暖身，之後整個 1–255 */
        var hi = qIndex <= 3 ? 15 : (qIndex <= 6 ? 63 : 255);
        var cur = value();
        var t, guard = 0;
        do {
          t = CSE.util.randInt(1, hi);
          guard++;
        } while (t === cur && guard < 50);
        target = t;
        numEl.textContent = String(target);
        qStart = performance.now();
        paint();   /* 若剛好已相等（極端狀況）也會正確處理 */
      }

      /* 鍵盤 1–8 */
      api.on(document, 'keydown', function (e) {
        if (e.key >= '1' && e.key <= '8') {
          e.preventDefault();
          toggle(parseInt(e.key, 10) - 1);
        }
      });

      api.setStat('連擊', 0);
      api.hint('撥開關讓「目前」等於「目標」');
      nextQuestion();

      api.onResult(function () {
        return {
          stats: [
            { k: '答對', v: solved + ' 題' },
            { k: '跳過', v: skipped + ' 題' },
            { k: '用提示', v: hintsUsed + ' 次' },
            { k: '平均', v: solved ? (60 / solved).toFixed(1) + ' 秒/題' : '—' }
          ]
        };
      });
    }
  });
})();

</script>
<script>
/* ===== assets/js/games/logic.js ===== */
/* ============================================================
   遊戲 2：邏輯閘實驗室 — 撥輸入讓輸出亮燈，後半段改成「選對的閘」
   教的是：AND / OR / NOT / XOR / NAND、真值表
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;

  /* ---------- 邏輯運算 ---------- */
  function gate(t, a, b) {
    if (a === null || a === undefined) return null;
    if (t !== 'NOT' && (b === null || b === undefined)) return null;
    switch (t) {
      case 'AND':  return (a && b) ? 1 : 0;
      case 'OR':   return (a || b) ? 1 : 0;
      case 'XOR':  return (a !== b) ? 1 : 0;
      case 'NAND': return (a && b) ? 0 : 1;
      case 'NOR':  return (a || b) ? 0 : 1;
      case 'XNOR': return (a === b) ? 1 : 0;
      case 'NOT':  return a ? 0 : 1;
    }
    return null;
  }

  var PALETTE = ['AND', 'OR', 'XOR', 'NAND', 'NOR'];

  /* 遞迴計算，並把結果記在 node._val 上供畫線用 */
  function evaluate(node, inv, assign) {
    var v;
    if (node.t === 'IN') {
      v = inv[node.i] ? 1 : 0;
    } else if (node.t === 'Q') {
      var g = assign[node.slot];
      var a = evaluate(node.a, inv, assign);
      var b = node.b ? evaluate(node.b, inv, assign) : null;
      v = g ? gate(g, a, b) : null;
    } else if (node.t === 'NOT') {
      v = gate('NOT', evaluate(node.a, inv, assign), null);
    } else {
      v = gate(node.t, evaluate(node.a, inv, assign), evaluate(node.b, inv, assign));
    }
    node._val = v;
    return v;
  }

  function children(node) {
    if (node.t === 'IN') return [];
    return node.b ? [node.a, node.b] : [node.a];
  }

  /* ---------- 關卡 ---------- */
  function IN(i) { return { t: 'IN', i: i }; }

  var LEVELS = [
    {
      name: 'AND 很挑',
      inputs: ['A', 'B'], mode: 'inputs', target: 1,
      tree: { t: 'AND', a: IN(0), b: IN(1) },
      note: 'AND（且）：<b>兩邊都是 1</b> 才輸出 1。讓燈泡亮起來。'
    },
    {
      name: 'NOT 會翻臉',
      inputs: ['A', 'B'], mode: 'inputs', target: 0,
      tree: { t: 'OR', a: { t: 'NOT', a: IN(0) }, b: IN(1) },
      note: 'NOT（反）把 0 變 1、1 變 0。這次目標是讓輸出變成 <b>0</b>。'
    },
    {
      name: 'XOR 只愛不一樣',
      inputs: ['A', 'B'], mode: 'inputs', target: 1,
      tree: { t: 'XOR', a: IN(0), b: IN(1) },
      note: 'XOR（互斥或）：<b>兩邊不一樣</b>才輸出 1。這就是加法器的核心。'
    },
    {
      name: '三個輸入',
      inputs: ['A', 'B', 'C'], mode: 'inputs', target: 1,
      tree: { t: 'AND', a: { t: 'XOR', a: IN(0), b: IN(1) }, b: { t: 'NOT', a: IN(2) } },
      note: '訊號會一層一層往右傳。目標輸出 <b>1</b>。'
    },
    {
      name: 'NAND 是萬能的',
      inputs: ['A', 'B', 'C'], mode: 'inputs', target: 0,
      tree: { t: 'NAND', a: { t: 'OR', a: IN(0), b: IN(1) }, b: { t: 'AND', a: IN(1), b: IN(2) } },
      note: 'NAND = NOT + AND。只用 NAND 就能組出所有邏輯閘，所以晶片特別愛它。目標輸出 <b>0</b>。'
    },
    {
      name: '走到底',
      inputs: ['A', 'B', 'C'], mode: 'inputs', target: 1,
      tree: { t: 'AND', a: { t: 'OR', a: IN(0), b: IN(1) }, b: { t: 'NOT', a: { t: 'AND', a: IN(1), b: IN(2) } } },
      note: '最後一題撥開關的題目。目標輸出 <b>1</b>。'
    },
    {
      name: '補上缺的閘',
      inputs: ['A', 'B'], mode: 'gate', slots: 1,
      tree: { t: 'Q', slot: 0, a: IN(0), b: IN(1) },
      table: [0, 1, 1, 1],
      note: '這次換你當設計師：點 <b>?</b> 選一個閘，讓電路符合右邊的真值表，再按「驗證」。'
    },
    {
      name: '反過來想',
      inputs: ['A', 'B'], mode: 'gate', slots: 1,
      tree: { t: 'NOT', a: { t: 'Q', slot: 0, a: IN(0), b: IN(1) } },
      table: [1, 0, 0, 1],
      note: '後面已經接了一個 NOT。前面要放什麼，整體才會符合真值表？'
    },
    {
      name: '兩個空格',
      inputs: ['A', 'B', 'C'], mode: 'gate', slots: 2,
      tree: { t: 'Q', slot: 1, a: { t: 'Q', slot: 0, a: IN(0), b: IN(1) }, b: IN(2) },
      table: [0, 1, 0, 1, 0, 1, 1, 1],
      note: '兩個空格都要填。答案不只一組，只要真值表全對就算過關。'
    }
  ];

  /* ---------- 版面計算 ---------- */
  /* 兩組尺寸：窄螢幕用小的，否則電路會被縮到開關按不到 */
  var WIDE = { ROW: 68, PAD: 44, IN_X: 54, COL_W: 132, GATE_W: 76, GATE_H: 46, TAIL: 110 };
  var NARROW = { ROW: 66, PAD: 34, IN_X: 42, COL_W: 100, GATE_W: 62, GATE_H: 40, TAIL: 76 };
  var ROW, PAD, IN_X, COL_W, GATE_W, GATE_H, TAIL;

  function useMetrics(containerW) {
    var m = containerW && containerW < 520 ? NARROW : WIDE;
    ROW = m.ROW; PAD = m.PAD; IN_X = m.IN_X;
    COL_W = m.COL_W; GATE_W = m.GATE_W; GATE_H = m.GATE_H; TAIL = m.TAIL;
  }
  useMetrics(0);

  function buildLayout(level) {
    var inputs = level.inputs;
    var inputY = inputs.map(function (_, i) { return PAD + i * ROW; });

    var all = [];
    (function walk(n) {
      children(n).forEach(walk);
      if (n.t !== 'IN') all.push(n);
    })(level.tree);

    /* col：葉子在 0，往輸出遞增 */
    function colOf(n) {
      if (n.t === 'IN') return 0;
      if (n._col !== undefined) return n._col;
      var c = 0;
      children(n).forEach(function (k) { c = Math.max(c, colOf(k)); });
      n._col = c + 1;
      return n._col;
    }
    function yOf(n) {
      if (n.t === 'IN') return inputY[n.i];
      if (n._y !== undefined) return n._y;
      var ks = children(n), sum = 0;
      ks.forEach(function (k) { sum += yOf(k); });
      n._y = sum / ks.length;
      return n._y;
    }
    all.forEach(function (n) { n._col = undefined; n._y = undefined; });
    all.forEach(colOf);
    all.forEach(yOf);

    /* 同一欄避免重疊 */
    var maxCol = 0;
    all.forEach(function (n) { maxCol = Math.max(maxCol, n._col); });
    for (var c = 1; c <= maxCol; c++) {
      var inCol = all.filter(function (n) { return n._col === c; })
        .sort(function (a, b) { return a._y - b._y; });
      for (var i = 1; i < inCol.length; i++) {
        if (inCol[i]._y - inCol[i - 1]._y < GATE_H + 14) {
          inCol[i]._y = inCol[i - 1]._y + GATE_H + 14;
        }
      }
    }
    all.forEach(function (n) { n._x = IN_X + GATE_W + 20 + (n._col - 1) * COL_W; });

    var maxY = Math.max.apply(null, inputY.concat(all.map(function (n) { return n._y; })));
    var contentW = IN_X + GATE_W + 20 + (maxCol - 1) * COL_W + GATE_W / 2 + TAIL;

    /* 畫布就等於內容寬度（不再補白），縮放交給下面的 maxWidth 控制 */
    return { nodes: all, inputY: inputY, ox: 0, w: contentW, h: maxY + PAD };
  }

  function outPort(n, lay) {
    return n.t === 'IN'
      ? { x: IN_X + lay.ox + 30, y: lay.inputY[n.i] }
      : { x: n._x + GATE_W / 2, y: n._y };
  }

  CSE.registerGame({
    id: 'logic',
    name: '邏輯閘實驗室',
    tag: '計算機組織 · LOGIC',
    icon: '&',
    accent: 'var(--violet)',
    blurb: 'CPU 裡面幾十億個電晶體，做的就是 AND / OR / NOT。撥開關點亮燈泡，再換你來設計電路。',
    how: [
      '左邊是輸入開關（A、B、C），點一下切換 0 / 1。',
      '訊號往右傳，亮綠色代表這條線是 1。',
      '前 6 關：撥開關讓最右邊的燈泡符合題目要求。',
      '後 3 關：點電路裡的「?」，從下方選一個邏輯閘，讓真值表全部正確，再按「驗證」。'
    ],
    controls: '點輸入開關切換 0/1；點「?」選閘',
    duration: 160,
    medals: { bronze: 650, silver: 1300, gold: 2100 },
    titles: ['體驗組', '邏輯新生', '電路達人', '晶片設計師'],
    knowledge: {
      title: '幾十億個開關疊出一台電腦',
      lines: [
        'CPU 裡沒有魔法，只有電晶體組成的 AND / OR / NOT 這些邏輯閘。',
        'XOR + AND 可以做出「半加器」，串起來就能做加法，再往上就是整台電腦。',
        'NAND 和 NOR 叫做「通用閘」：只用其中一種就能組出所有邏輯。',
        '這是資工系「數位邏輯設計」和「計算機組織」在教的東西。'
      ]
    },

    mount: function (stage, api) {
      var li = 0;                 /* 目前關卡 */
      var inv = [];               /* 輸入值 */
      var assign = {};            /* slot -> gate type */
      var selSlot = null;
      var cleared = 0, wrongTries = 0, levelStart = 0;

      var taskEl = api.el('div', { class: 'lg-task' });
      var dots = api.el('div', { class: 'lvdots' });
      var canvas = api.el('div', { class: 'lg-canvas' });
      var truth = api.el('div', { class: 'lg-truth' });
      var palette = api.el('div', { class: 'lg-palette' });

      stage.appendChild(api.el('div', { class: 'lg-wrap' }, [
        dots, taskEl, canvas, truth, palette
      ]));

      function paintDots() {
        CSE.ui.clear(dots);
        LEVELS.forEach(function (_, i) {
          dots.appendChild(api.el('i', {
            class: 'lvdot ' + (i < li ? 'done' : i === li ? 'now' : '')
          }));
        });
      }

      /* ---------- 繪製電路 ---------- */
      function render() {
        var lv = LEVELS[li];
        var lay = buildLayout(lv);
        evaluate(lv.tree, inv, assign);

        var svg = api.svg('svg', {
          viewBox: '0 0 ' + Math.round(lay.w) + ' ' + Math.round(lay.h),
          role: 'img', 'aria-label': '邏輯電路圖'
        });
        /* 小電路最多放大 1.7 倍就好，不然字會大到不自然；
           大電路則讓它撐滿容器，開關才不會小到按不到 */
        svg.style.maxWidth = Math.round(Math.min(760, lay.w * 1.7)) + 'px';

        /* 連線 */
        lay.nodes.forEach(function (n) {
          var ks = children(n);
          ks.forEach(function (k, idx) {
            var p1 = outPort(k, lay);
            var dy = ks.length === 2 ? (idx === 0 ? -12 : 12) : 0;
            var p2 = { x: n._x - GATE_W / 2, y: n._y + dy };
            var on = k._val === 1;
            svg.appendChild(api.svg('path', {
              class: 'wire' + (on ? ' on' : ''),
              d: 'M' + p1.x + ' ' + p1.y +
                 ' C' + (p1.x + 46) + ' ' + p1.y +
                 ' ' + (p2.x - 46) + ' ' + p2.y +
                 ' ' + p2.x + ' ' + p2.y
            }));
          });
        });

        /* 輸出線 + 燈泡 */
        var root = lv.tree;
        var rp = outPort(root, lay);
        var lampX = rp.x + 72;
        svg.appendChild(api.svg('path', {
          class: 'wire' + (root._val === 1 ? ' on' : ''),
          d: 'M' + rp.x + ' ' + rp.y + ' L' + (lampX - 18) + ' ' + rp.y
        }));
        svg.appendChild(api.svg('circle', {
          class: 'lamp' + (root._val === 1 ? ' on' : ''),
          cx: lampX, cy: rp.y, r: 17
        }));
        svg.appendChild(api.svg('text', {
          class: 'ew', x: lampX, y: rp.y + 36, text: '輸出 ' + (root._val === null ? '?' : root._val)
        }));

        /* 輸入開關 */
        lv.inputs.forEach(function (name, i) {
          var y = lay.inputY[i];
          var ix = IN_X + lay.ox;
          var g = api.svg('g', { class: 'sw' + (inv[i] ? ' on' : ''), tabindex: '0', role: 'button',
            'aria-label': '輸入 ' + name + ' 目前是 ' + (inv[i] ? 1 : 0) });
          /* 看不見的放大觸控區：手機上視覺尺寸不夠 44px，但手指按得到 */
          g.appendChild(api.svg('rect', {
            class: 'hitbox', x: ix - 40, y: y - 32, width: 80, height: 64
          }));
          g.appendChild(api.svg('rect', { x: ix - 30, y: y - 21, width: 60, height: 42, rx: 7 }));
          g.appendChild(api.svg('text', { class: 'n', x: ix - 14, y: y + 5, text: name }));
          g.appendChild(api.svg('text', { class: 'b', x: ix + 14, y: y + 5, text: String(inv[i] ? 1 : 0) }));
          function hit() { inv[i] = inv[i] ? 0 : 1; api.sfx.play('click'); afterChange(); }
          g.addEventListener('click', hit);
          g.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hit(); }
          });
          svg.appendChild(g);
        });

        /* 閘 */
        lay.nodes.forEach(function (n) {
          var isQ = n.t === 'Q';
          var label = isQ ? (assign[n.slot] || '?') : n.t;
          var cls = 'gatebox' + (isQ && !assign[n.slot] ? ' q' : '') + (isQ && selSlot === n.slot ? ' sel' : '');
          var g = api.svg('g', isQ ? { class: 'sw', tabindex: '0', role: 'button', 'aria-label': '空的邏輯閘' } : {});
          if (isQ) {
            g.appendChild(api.svg('rect', {
              class: 'hitbox', x: n._x - GATE_W / 2 - 12, y: n._y - GATE_H / 2 - 12,
              width: GATE_W + 24, height: GATE_H + 24
            }));
          }
          g.appendChild(api.svg('rect', {
            class: cls, x: n._x - GATE_W / 2, y: n._y - GATE_H / 2,
            width: GATE_W, height: GATE_H, rx: 8
          }));
          g.appendChild(api.svg('text', {
            class: 'gatelabel' + (isQ && !assign[n.slot] ? ' q' : ''),
            x: n._x, y: n._y, text: label
          }));
          if (isQ) {
            function sel() { selSlot = n.slot; api.sfx.play('click'); render(); paintPalette(); }
            g.addEventListener('click', sel);
            g.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel(); }
            });
          }
          svg.appendChild(g);
        });

        CSE.ui.clear(canvas);
        canvas.appendChild(svg);
      }

      /* ---------- 真值表 ---------- */
      function paintTruth() {
        var lv = LEVELS[li];
        CSE.ui.clear(truth);
        if (lv.mode !== 'gate') return;
        var n = lv.inputs.length;
        var head = api.el('tr', {}, lv.inputs.map(function (name) { return api.el('th', { text: name }); })
          .concat([api.el('th', { text: '期望' }), api.el('th', { text: '目前' })]));
        var rows = [];
        var curIdx = 0;
        for (var i = 0; i < n; i++) curIdx = (curIdx << 1) | (inv[i] ? 1 : 0);
        for (var idx = 0; idx < (1 << n); idx++) {
          var bits = [];
          for (var b = 0; b < n; b++) bits.push((idx >> (n - 1 - b)) & 1);
          evaluate(lv.tree, bits, assign);
          var got = lv.tree._val;
          var want = lv.table[idx];
          var tds = bits.map(function (v) { return api.el('td', { text: String(v) }); });
          tds.push(api.el('td', { class: 'out', text: String(want) }));
          tds.push(api.el('td', {
            text: got === null ? '—' : String(got),
            style: { color: got === null ? 'var(--fg-faint)' : (got === want ? 'var(--green)' : 'var(--red)') }
          }));
          rows.push(api.el('tr', { class: idx === curIdx ? 'now' : '' }, tds));
        }
        /* 還原成玩家目前撥的輸入 */
        evaluate(lv.tree, inv, assign);
        truth.appendChild(api.el('table', {}, [
          api.el('thead', {}, head), api.el('tbody', {}, rows)
        ]));
      }

      /* ---------- 工具列 ---------- */
      function paintPalette() {
        var lv = LEVELS[li];
        CSE.ui.clear(palette);
        if (lv.mode !== 'gate') {
          palette.appendChild(api.el('div', { class: 'faint', style: { fontSize: '12.5px' },
            text: '提示：先看最右邊的閘需要什麼，再往左推回去。' }));
          return;
        }
        palette.appendChild(api.el('span', { class: 'faint', style: { fontSize: '12.5px' },
          text: selSlot === null ? '先點電路裡的 ? →' : '放入：' }));
        PALETTE.forEach(function (t) {
          palette.appendChild(api.el('button', {
            type: 'button', class: 'btn btn--sm', text: t, disabled: selSlot === null,
            onclick: function () {
              assign[selSlot] = t;
              api.sfx.play('click');
              selSlot = null;
              afterChange();
            }
          }));
        });
        palette.appendChild(api.el('button', {
          type: 'button', class: 'btn btn--sm', text: '清空',
          onclick: function () { assign = {}; selSlot = null; api.sfx.play('click'); afterChange(); }
        }));
        palette.appendChild(api.el('button', {
          type: 'button', class: 'btn btn--sm btn--primary', text: '驗證',
          onclick: verify
        }));
      }

      function verify() {
        if (li >= LEVELS.length) return;          /* 全破之後不再接受操作 */
        var lv = LEVELS[li];
        var n = lv.inputs.length;
        for (var s = 0; s < (lv.slots || 1); s++) {
          if (!assign[s]) {
            api.hint('還有空格沒填。', 'bad');
            api.sfx.play('bad');
            return;
          }
        }
        var ok = true;
        for (var idx = 0; idx < (1 << n) && ok; idx++) {
          var bits = [];
          for (var b = 0; b < n; b++) bits.push((idx >> (n - 1 - b)) & 1);
          evaluate(lv.tree, bits, assign);
          if (lv.tree._val !== lv.table[idx]) ok = false;
        }
        evaluate(lv.tree, inv, assign);
        if (ok) { levelCleared(); }
        else {
          wrongTries++;
          api.addScore(-30);
          api.sfx.play('bad');
          api.hint('還沒對。看「目前」欄哪幾列是紅的，就知道差在哪。', 'bad');
          paintTruth();
        }
      }

      function afterChange() {
        if (li >= LEVELS.length) return;
        var lv = LEVELS[li];
        evaluate(lv.tree, inv, assign);
        render();
        paintTruth();
        paintPalette();
        if (lv.mode === 'inputs' && lv.tree._val === lv.target) levelCleared();
      }

      function levelCleared() {
        cleared++;
        var spent = (performance.now() - levelStart) / 1000;
        var speed = Math.max(0, Math.round((20 - spent) * 6));
        var gain = 150 + speed;
        api.addScore(gain);
        api.sfx.play('great');
        api.hint('第 ' + (li + 1) + ' 關過關！+' + gain + ' 分', 'good');
        li++;
        if (li >= LEVELS.length) {
          var bonus = Math.round(api.timeLeft() * 6);
          api.addScore(bonus);
          api.finish({
            reason: 'cleared',
            stats: [
              { k: '過關', v: cleared + ' / ' + LEVELS.length },
              { k: '驗證失敗', v: wrongTries + ' 次' },
              { k: '剩餘時間加分', v: '+' + bonus }
            ]
          });
          return;
        }
        api.after(650, loadLevel);
      }

      function loadLevel() {
        if (li >= LEVELS.length) return;
        var lv = LEVELS[li];
        assign = {}; selSlot = null;
        inv = lv.inputs.map(function () { return 0; });

        /* 避免「一開始就已經達成目標」 */
        if (lv.mode === 'inputs') {
          evaluate(lv.tree, inv, assign);
          if (lv.tree._val === lv.target) {
            var n = lv.inputs.length;
            for (var idx = 1; idx < (1 << n); idx++) {
              var bits = [];
              for (var b = 0; b < n; b++) bits.push((idx >> (n - 1 - b)) & 1);
              evaluate(lv.tree, bits, assign);
              if (lv.tree._val !== lv.target) { inv = bits; break; }
            }
          }
        }

        levelStart = performance.now();
        api.setStat('關卡', (li + 1) + '/' + LEVELS.length);
        taskEl.innerHTML = '<b>第 ' + (li + 1) + ' 關 · ' + CSE.ui.esc(lv.name) + '</b>　' + lv.note;
        paintDots();
        afterChange();
      }

      api.onResult(function () {
        return {
          stats: [
            { k: '過關', v: cleared + ' / ' + LEVELS.length },
            { k: '驗證失敗', v: wrongTries + ' 次' }
          ]
        };
      });

      loadLevel();
    }
  });
})();

</script>
<script>
/* ===== assets/js/games/bughunt.js ===== */
/* ============================================================
   遊戲 3：Bug 獵人 — 在程式碼裡點出有問題的那一行
   開場先選程式語言（Python / C / JavaScript），
   題目不會混在一起，玩家才知道要用哪一種語言的邏輯去想。
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;

  /* ---------- 題庫：bugLines 可給多行（有些錯誤本質上橫跨兩行） ---------- */

  var PY = [
    {
      title: 'average.py — 計算平均分數',
      code: [
        'scores = [90, 85, 77, 60]',
        'total = 0',
        'for i in range(0, 5):',
        '    total = total + scores[i]',
        'print(total / 4)'
      ],
      bugLines: [3],
      why: '清單只有 4 個元素（編號 0~3），<code>range(0, 5)</code> 會跑到 i = 4，抓 <code>scores[4]</code> 就爆掉了。',
      fix: '改成 <code>range(0, len(scores))</code>，永遠跟著清單長度走。',
      hint: '數一下清單裡有幾個數字，再看迴圈跑幾次。',
      kind: '陣列越界 / off-by-one'
    },
    {
      title: 'login.py — 檢查密碼',
      code: [
        'password = input("請輸入密碼：")',
        'if password = "1234":',
        '    print("歡迎回來")',
        'else:',
        '    print("密碼錯誤")'
      ],
      bugLines: [2],
      why: '<code>=</code> 是「賦值」，<code>==</code> 才是「比較」。這行等於想把字串塞進 password，不是在比較。',
      fix: '改成 <code>if password == "1234":</code>',
      hint: '「等於」在程式裡有兩種寫法，意思完全不同。',
      kind: '= 與 == 混用'
    },
    {
      title: 'countdown.py — 倒數計時',
      code: [
        'n = 10',
        'while n > 0:',
        '    print(n)',
        '    n = n + 1',
        'print("發射！")'
      ],
      bugLines: [4],
      why: 'n 每次都變大，<code>n > 0</code> 永遠成立 → 無限迴圈，程式會卡死。',
      fix: '改成 <code>n = n - 1</code>。',
      hint: '想像 n 的值一步一步變成什麼，迴圈什麼時候才會停。',
      kind: '無限迴圈'
    },
    {
      title: 'wordcount.py — 算所有單字總長度',
      code: [
        'words = ["cat", "dog", "fish"]',
        'for w in words:',
        '    count = 0',
        '    count = count + len(w)',
        'print(count)'
      ],
      bugLines: [3],
      why: '歸零的動作被寫在迴圈裡面，每一圈都重新變成 0，最後只剩最後一個單字的長度。',
      fix: '把 <code>count = 0</code> 移到迴圈外面（第 2 行之前）。',
      hint: '注意縮排：哪些行在迴圈「裡面」？',
      kind: '變數初始化位置錯誤'
    },
    {
      title: 'swap.py — 交換兩個變數',
      code: [
        'a = 3',
        'b = 5',
        'a = b',
        'b = a',
        'print(a, b)'
      ],
      bugLines: [3, 4],
      why: '第 3 行先把 a 蓋成 5，原本的 3 就消失了，第 4 行再抄回來只會得到 5, 5。',
      fix: '先存起來：<code>tmp = a; a = b; b = tmp</code>（Python 也可以 <code>a, b = b, a</code>）。',
      hint: '把每一行執行完 a、b 各是多少寫在旁邊試試。',
      kind: '覆蓋資料 / 缺暫存變數'
    },
    {
      title: 'float.py — 浮點數比較',
      code: [
        'x = 0.1 + 0.2',
        'if x == 0.3:',
        '    print("相等")',
        'else:',
        '    print("居然不相等")'
      ],
      bugLines: [2],
      why: '電腦用二進位存小數，0.1 + 0.2 實際是 0.30000000000000004，直接用 <code>==</code> 比會失敗。',
      fix: '改成比差距：<code>if abs(x - 0.3) &lt; 1e-9:</code>',
      hint: '這段其實沒有語法錯，但輸出會跟你想的不一樣。',
      kind: '浮點數精度'
    },
    {
      title: 'pizza.py — 分披薩',
      code: [
        'students = 7',
        'pizza = 3',
        'each = pizza // students',
        'print("每人分到", each, "片")'
      ],
      bugLines: [3],
      why: '<code>//</code> 是整數除法，3 // 7 直接變成 0，每個人都分到 0 片。',
      fix: '用 <code>/</code> 得到 0.428…，或換算成「每人幾分之幾」。',
      hint: '3 除以 7 的結果，用這個運算子算出來是多少？',
      kind: '整數除法'
    },
    {
      title: 'age.py — 計算明年年齡',
      code: [
        'age = input("你幾歲？")',
        'next_year = age + 1',
        'print("明年你", next_year, "歲")'
      ],
      bugLines: [2],
      why: '<code>input()</code> 拿回來的是字串，字串不能直接加數字。',
      fix: '先轉型：<code>age = int(input("你幾歲？"))</code>',
      hint: '使用者打進來的東西，在程式裡是什麼型別？',
      kind: '型別錯誤'
    },
    {
      title: 'filter.py — 刪掉偶數',
      code: [
        'nums = [1, 2, 3, 4, 5, 6]',
        'for n in nums:',
        '    if n % 2 == 0:',
        '        nums.remove(n)',
        'print(nums)'
      ],
      bugLines: [4],
      why: '邊走邊刪：刪掉一個元素後面全部往前移，迴圈的位置卻繼續往後，會跳過元素。',
      fix: '另外建新清單：<code>nums = [n for n in nums if n % 2 != 0]</code>',
      hint: '一邊走一邊改手上的清單，會發生什麼事？',
      kind: '迭代中修改容器'
    },
    {
      title: 'square.py — 平方函式',
      code: [
        'def square(n):',
        '    answer = n * n',
        '',
        'print(square(4))'
      ],
      bugLines: [2],
      why: '算完了卻沒有把答案交出去，函式預設回傳 None，所以會印出 None。',
      fix: '加上 <code>return answer</code>。',
      hint: '函式算完之後，怎麼把結果給外面？',
      kind: '忘記 return'
    },
    {
      title: 'grade.py — 判斷成績區間',
      code: [
        'score = 85',
        'if score > 60 and < 90:',
        '    print("及格，但還不是高分")'
      ],
      bugLines: [2],
      why: '<code>and</code> 兩邊都必須是完整的條件，<code>&lt; 90</code> 少了左邊的 score。',
      fix: '改成 <code>if score > 60 and score &lt; 90:</code>（Python 也能寫 <code>60 &lt; score &lt; 90</code>）。',
      hint: '把 and 左右兩半分開唸一次，右半邊唸得通嗎？',
      kind: '條件式語法錯誤'
    },
    {
      title: 'first.py — 取第一個使用者',
      code: [
        'users = []',
        'first = users[0]',
        'if first != None:',
        '    print(first)'
      ],
      bugLines: [2],
      why: '清單是空的，還沒檢查就直接取 <code>[0]</code>，程式在第 2 行就當掉了，第 3 行的檢查根本來不及。',
      fix: '先檢查再取：<code>if len(users) > 0:</code>',
      hint: '檢查的順序對嗎？哪一行會先被執行？',
      kind: '未檢查就取值'
    },
    {
      title: 'fact.py — 階乘',
      code: [
        'def fact(n):',
        '    return n * fact(n - 1)',
        '',
        'print(fact(5))'
      ],
      bugLines: [2],
      why: '遞迴沒有終止條件，會一直往下叫自己，直到堆疊爆掉。',
      fix: '補上終止條件：<code>if n &lt;= 1: return 1</code>',
      hint: '這個函式會自己呼叫自己，什麼時候才停下來？',
      kind: '遞迴缺終止條件'
    },
    {
      title: 'cart.py — 購物車總價',
      code: [
        'total_price = 0',
        'items = [100, 250, 80]',
        'for p in items:',
        '    total_prices = total_price + p',
        'print(total_price)'
      ],
      bugLines: [4],
      why: '變數名多打一個 s（<code>total_prices</code>），累加其實加到一個新變數上，原本的永遠是 0。',
      fix: '改成 <code>total_price = total_price + p</code>。',

  function tokenRe(lang) {
    var comment = lang === 'python' ? '(#[^\\n]*)' : '(\\/\\/[^\\n]*)';
    return new RegExp(
      comment +
      '|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')' +
      '|\\b(\\d+\\.?\\d*(?:e-?\\d+)?)\\b' +
      '|\\b(' + KEYWORDS[lang] + ')\\b' +
      '|\\b(' + FUNCS[lang] + ')\\b',
      'g');
  }

  function highlight(line, lang) {
    var re = tokenRe(lang);
    var out = '', last = 0, m;
    while ((m = re.exec(line)) !== null) {
      out += CSE.ui.esc(line.slice(last, m.index));
      var cls = m[1] ? 'tk-com' : m[2] ? 'tk-str' : m[3] ? 'tk-num' : m[4] ? 'tk-key' : 'tk-fn';
      out += '<span class="' + cls + '">' + CSE.ui.esc(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    out += CSE.ui.esc(line.slice(last));
    return out;
  }
