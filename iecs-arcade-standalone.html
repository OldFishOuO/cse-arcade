          api.sfx.play('bad');
          row.classList.add('wrong');
          s.bugLines.forEach(function (b) { if (lineEls[b]) lineEls[b].classList.add('reveal'); });
          fb.className = 'bh-fb wrong';
          fb.innerHTML = '<b>✗ 錯誤在第 ' + s.bugLines.join(' / ') + ' 行 · ' + CSE.ui.esc(s.kind) + '</b><br>' +
            s.why + '<br><span class="faint">修法：</span>' + s.fix;
        }
        if (lives <= 0) { api.after(2400, function () { gameOver('lives'); }); }
      }

      function timeUp() {
        if (locked) return;
        var s = queue[qi];
        wrong++;
        lives--;
        paintLives();
        locked = true;
        nextBtn.classList.remove('hidden');
        api.sfx.play('bad');
        s.bugLines.forEach(function (b) { if (lineEls[b]) lineEls[b].classList.add('reveal'); });
        fb.className = 'bh-fb wrong';
        fb.innerHTML = '<b>⏱ 時間到 — 錯誤在第 ' + s.bugLines.join(' / ') + ' 行</b><br>' +
          s.why + '<br><span class="faint">修法：</span>' + s.fix;
        if (lives <= 0) api.after(2400, function () { gameOver('lives'); });
      }

      function nextQ() {
        if (lives <= 0) { gameOver('lives'); return; }   /* 搶在延遲結束前按「下一題」 */
        qi++;
        if (qi >= queue.length) { gameOver('cleared'); return; }
        var s = queue[qi];
        hintOn = false;
        locked = false;
        qLeft = PER_Q;
        qLeftEl.textContent = String(PER_Q);
        nextBtn.classList.add('hidden');
        kindEl.textContent = '第 ' + (qi + 1) + ' / ' + queue.length + ' 題';
        api.setStat('答對', right);
        fb.className = 'bh-fb';
        fb.textContent = '點一行你覺得有問題的程式碼。';
        api.hint('');
        renderSnippet(s);
      }

      function gameOver(reason) {
        api.finish({
          reason: reason === 'cleared' ? 'cleared' : 'timeout',
          stats: [
            { k: '語言', v: lang ? lang.label : '—' },
            { k: '答對', v: right + ' 題' },
            { k: '答錯', v: wrong + ' 題' },
            { k: '用提示', v: hintUsed + ' 次' },
            { k: '剩餘生命', v: Math.max(0, lives) }
          ]
        });
      }

      /* 鍵盤選行 */
      api.on(document, 'keydown', function (e) {
        if (!started) return;
        if (locked) {
          if (e.key === 'Enter' && nextBtn && !nextBtn.classList.contains('hidden')) {
            e.preventDefault(); nextQ();
          }
          return;
        }
        var n = parseInt(e.key, 10);
        if (!isNaN(n) && lineEls[n]) { e.preventDefault(); answer(n, lineEls[n]); }
      });

      api.onResult(function () {
        return {
          stats: [
            { k: '語言', v: lang ? lang.label : '（還沒選）' },
            { k: '答對', v: right + ' 題' },
            { k: '答錯', v: wrong + ' 題' },
            { k: '用提示', v: hintUsed + ' 次' }
          ]
        };
      });

      showPicker();

      /* 每題獨立倒數（用真實時鐘，視窗被蓋住也不會卡住） */
      return {
        onTick: function (dt) {
          if (!started || locked) return;
          qLeft -= dt;
          if (qLeft <= 0) { qLeft = 0; qLeftEl.textContent = '0'; timeUp(); return; }
          qLeftEl.textContent = String(Math.ceil(qLeft));
        }
      };
    }
  });
})();

</script>
<script>
/* ===== assets/js/games/sort.js ===== */
/* ============================================================
   遊戲 4：排序大師 — 用最少的交換次數把長條由小到大排好
   教的是：排序、置換環（最少交換次數 = n − 環數）
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;

  var ROUNDS = [5, 6, 7];

  /* 最少交換次數（任意兩兩交換）= n − 置換環數，需要元素互不相同 */
  function minSwaps(arr) {
    var sorted = arr.slice().sort(function (a, b) { return a - b; });
    var pos = {};
    sorted.forEach(function (v, i) { pos[v] = i; });
    var seen = new Array(arr.length);
    var swaps = 0;
    for (var i = 0; i < arr.length; i++) {
      if (seen[i]) continue;
      var j = i, len = 0;
      while (!seen[j]) { seen[j] = true; j = pos[arr[j]]; len++; }
      swaps += len - 1;
    }
    return swaps;
  }

  function isSorted(a) {
    for (var i = 1; i < a.length; i++) if (a[i - 1] > a[i]) return false;
    return true;
  }

  /* 產生互不相同、尚未排好、且至少要 2 次交換的題目 */
  function makeArray(n) {
    for (var attempt = 0; attempt < 200; attempt++) {
      var pool = [];
      while (pool.length < n) {
        var v = CSE.util.randInt(5, 99);
        if (pool.indexOf(v) < 0) pool.push(v);
      }
      var arr = CSE.util.shuffle(pool);
      if (!isSorted(arr) && minSwaps(arr) >= 2) return arr;
    }
    return [42, 17, 93, 8, 55].slice(0, n);
  }

  CSE.registerGame({
    id: 'sort',
    name: '排序大師',
    tag: '演算法 · SORTING',
    icon: '↕',
    accent: 'var(--cyan)',
    blurb: '把長條由小到大排好 — 聽起來簡單，但要用「最少的交換次數」就是演算法的問題了。',
    how: [
      '點一根長條選起來，再點另一根就會交換兩者。',
      '目標：由左到右從小排到大。',
      '每關都有「理論最少交換次數」，超過會扣分，剛好達標有大獎。',
      '共三關，長條會越來越多。'
    ],
    controls: '點兩根長條交換；再點同一根可取消選取',
    duration: 150,
    medals: { bronze: 700, silver: 1250, gold: 1850 },
    titles: ['體驗組', '排序學徒', '交換達人', '演算法大師'],
    knowledge: {
      title: '為什麼「最少交換次數」算得出來？',
      lines: [
        '把「誰該去哪裡」畫成箭頭，會形成一圈一圈的環。長度 k 的環需要 k−1 次交換。',
        '所以最少交換次數 = 元素個數 − 環的數量。這是離散數學裡的置換（permutation）理論。',
        '真正的排序演算法比的是「比較次數」：泡泡排序 O(n²)、快速排序平均 O(n log n)。',
        '一百萬筆資料，兩者差距大約是 50000 倍 — 這就是資工系「演算法」在乎的事。'
      ]
    },

    mount: function (stage, api) {
      var round = 0;
      var arr = [], sortedRef = [], par = 0, swaps = 0, sel = -1;
      var bars = [];
      var roundStart = 0, busy = false;
      var totalSwaps = 0, perfect = 0;

      var barsBox = api.el('div', { class: 'bars' });
      var parEl = api.el('b', { text: '0' });
      var swEl = api.el('b', { text: '0' });
      var info = api.el('div', { class: 'sm-info' }, [
        api.el('div', { class: 'statlist' }, [
          api.el('div', {}, ['目標最少交換', parEl]),
          api.el('div', {}, ['你已交換', swEl])
        ])
      ]);
      var btnReset = api.el('button', {
        type: 'button', class: 'btn btn--sm', text: '這關重排（−50）',
        onclick: function () {
          if (busy) return;
          api.addScore(-50);
          api.sfx.play('bad');
          loadRound(ROUNDS[round]);
        }
      });

      stage.appendChild(api.el('div', { class: 'sm-wrap' }, [
        barsBox,
        info,
        api.el('div', { class: 'row', style: { justifyContent: 'center' } }, [btnReset])
      ]));

      /* 用像素而不是百分比：.bars 是 flex 伸縮來的高度，
         在 flex 容器裡百分比高度不保證解析得出來（實測會縮成內容高度）。 */
      function barPx(v) {
        var box = barsBox.clientHeight || 240;
        var max = Math.max.apply(null, arr) || 1;
        return Math.round(box * (0.24 + (v / max) * 0.72));
      }

      function paintBar(i) {
        var b = bars[i];
        b.textContent = String(arr[i]);
        b.style.height = barPx(arr[i]) + 'px';
        b.classList.toggle('sel', sel === i);
        b.classList.toggle('ok', arr[i] === sortedRef[i]);
        b.setAttribute('aria-label', '第 ' + (i + 1) + ' 根，數值 ' + arr[i]);
      }
      function paintAll() { for (var i = 0; i < arr.length; i++) paintBar(i); }

      function click(i) {
        if (busy) return;
        if (sel === i) { sel = -1; api.sfx.play('click'); paintAll(); return; }
        if (sel < 0) { sel = i; api.sfx.play('click'); paintAll(); return; }
        var a = sel; sel = -1;
        var t = arr[a]; arr[a] = arr[i]; arr[i] = t;
        swaps++; totalSwaps++;
        swEl.textContent = String(swaps);
        api.sfx.play('type');
        paintAll();
        if (isSorted(arr)) roundDone();
        else if (swaps > par) api.hint('已經超過最少次數 ' + (swaps - par) + ' 次，但還是可以排完。', 'bad');
        else api.hint('還剩 ' + (par - swaps) + ' 次交換額度', '');
      }

      function roundDone() {
        busy = true;
        var over = Math.max(0, swaps - par);
        var spent = (performance.now() - roundStart) / 1000;
        var speed = Math.max(0, Math.round((30 - spent) * 4));
        var gain = Math.max(40, 230 - over * 35) + speed;
        if (over === 0) { gain += 120; perfect++; }
        api.addScore(gain);
        api.sfx.play('great');
        api.hint(over === 0
          ? '完美！剛好 ' + par + ' 次交換　+' + gain + ' 分（含完美獎勵）'
          : '排好了！用了 ' + swaps + ' 次（最少 ' + par + ' 次）　+' + gain + ' 分', 'good');
        round++;
        if (round >= ROUNDS.length) {
          var bonus = Math.round(api.timeLeft() * 5);
          api.addScore(bonus);
          api.after(900, function () {
            api.finish({
              reason: 'cleared',
              stats: [
                { k: '完美關卡', v: perfect + ' / ' + ROUNDS.length },
                { k: '總交換', v: totalSwaps + ' 次' },
                { k: '剩餘時間加分', v: '+' + bonus }
              ]
            });
          });
          return;
        }
        api.after(1100, function () { loadRound(ROUNDS[round]); });
      }

      function loadRound(n) {
        busy = false;
        sel = -1;
        swaps = 0;
        arr = makeArray(n);
        sortedRef = arr.slice().sort(function (a, b) { return a - b; });
        par = minSwaps(arr);
        parEl.textContent = String(par);
        swEl.textContent = '0';
        api.setStat('關卡', (round + 1) + '/' + ROUNDS.length);
        api.hint('點兩根長條交換它們的位置');

        CSE.ui.clear(barsBox);
        bars = [];
        for (var i = 0; i < n; i++) {
          var b = api.el('button', { type: 'button', class: 'bar' });
          (function (idx) { b.addEventListener('click', function () { click(idx); }); })(i);
          bars.push(b);
          barsBox.appendChild(b);
        }
        paintAll();
        roundStart = performance.now();
      }

      /* 視窗大小改變（轉向、全螢幕）時重算高度 */
      api.on(window, 'resize', function () { if (bars.length) paintAll(); });

      api.onResult(function () {
        return {
          stats: [
            { k: '完成關卡', v: round + ' / ' + ROUNDS.length },
            { k: '完美關卡', v: perfect },
            { k: '總交換', v: totalSwaps + ' 次' }
          ]
        };
      });

      loadRound(ROUNDS[0]);
    }
  });
})();

</script>
<script>
/* ===== assets/js/games/typing.js ===== */
/* ============================================================
   遊戲 5：終端機打字 — 把指令正確打出來
   教的是：常用命令列指令在做什麼（順便練鍵盤）
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;

  var CMDS = [
    ['ls -la', '列出目前資料夾裡所有檔案，包含隱藏檔與詳細資訊'],
    ['cd ..', '回到上一層資料夾'],
    ['pwd', '印出「我現在在哪個資料夾」'],
    ['mkdir project', '建立一個叫 project 的新資料夾'],
    ['rm -rf build', '強制刪除 build 資料夾（這個指令很危險，業界的恐怖故事來源）'],
    ['cp a.txt b.txt', '把 a.txt 複製成 b.txt'],
    ['mv old.js new.js', '把檔案改名或搬家'],
    ['cat README.md', '把檔案內容印在畫面上'],
    ['grep -r "TODO" .', '在所有檔案裡搜尋含 TODO 的那幾行'],
    ['chmod +x run.sh', '讓 run.sh 變成可執行檔'],
    ['git status', '看看哪些檔案改過但還沒存成版本'],
    ['git add .', '把所有修改標記成「準備提交」'],
    ['git commit -m "fix bug"', '把這次修改存成一個版本紀錄'],
    ['git push origin main', '把本機的版本推上遠端倉庫'],
    ['git pull', '把別人推上去的修改抓下來'],
    ['git log --oneline', '用一行一筆的方式看版本歷史'],
    ['git checkout -b feature', '開一條新分支來開發新功能'],
    ['npm install', '依照設定檔把專案需要的套件全部裝好'],
    ['npm run dev', '啟動開發用的伺服器'],
    ['python3 main.py', '用 Python 執行 main.py'],
    ['pip install numpy', '安裝 Python 的數值運算套件'],
    ['docker ps', '列出正在執行的容器'],
    ['ssh user@server', '遠端登入另一台電腦'],
    ['ping 8.8.8.8', '測試網路是否通、延遲多少毫秒'],
    ['curl -I example.com', '只抓網頁的 HTTP 標頭回來看'],
    ['kill -9 1234', '強制結束編號 1234 的程式'],
    ['top', '看哪個程式吃掉你的 CPU'],
    ['ps aux | grep node', '找出所有跟 node 有關的程序'],
    ['sudo apt update', '更新系統的套件清單（sudo = 用管理員身分）'],
    ['echo $PATH', '印出系統尋找指令的路徑清單']
  ];

  CSE.registerGame({
    id: 'typing',
    name: '終端機打字',
    tag: '系統 · TERMINAL',
    icon: '>_',
    accent: 'var(--lime)',
    blurb: '工程師的日常是黑底白字的視窗。把指令一字不差打出來，順便搞懂每個指令在做什麼。',
    how: [
      '畫面中間出現一個指令，照著打在輸入框裡。',
      '打對的字變綠色，打錯會變紅色 — 要退格改掉才能繼續。',
      '完全正確就自動跳下一個指令，不用按 Enter。',
      '下方會解釋這個指令在做什麼。限時 50 秒。'
    ],
    controls: '鍵盤輸入（請先切換成英數輸入法）',
    duration: 50,
    medals: { bronze: 700, silver: 1400, gold: 2300 },
    titles: ['體驗組', '鍵盤新手', '終端機熟手', '鍵盤俠'],
    knowledge: {
      title: '為什麼工程師還在用命令列？',
      lines: [
        '因為指令可以被「記下來、重複執行、自動化」 — 滑鼠點過的動作沒辦法。',
        '一行 grep 就能在幾萬個檔案裡找字串，比任何搜尋介面都快。',
        'git 是版本控制工具，業界幾乎人人在用；它記得你程式的每一次修改。',
        '資工系的「作業系統」「系統程式」就在教這些指令底下發生了什麼事。'
      ]
    },

    mount: function (stage, api) {
      var pool = CSE.util.shuffle(CMDS);
      var pi = 0;
      var target = '', desc = '';
      var typedOK = 0, errors = 0, done = 0, prevLen = 0;
      var startAt = performance.now();

      var targetEl = api.el('div', { class: 'ty-target' });
      var descEl = api.el('div', { class: 'ty-desc' });
      var input = api.el('input', {
        type: 'text', class: 'ty-input', autocomplete: 'off', autocapitalize: 'off',
        autocorrect: 'off', spellcheck: 'false', 'aria-label': '指令輸入框',
        placeholder: '在這裡打字…'
      });
      var wpmEl = api.el('b', { text: '0' });
      var accEl = api.el('b', { text: '100%' });
      var live = api.el('div', { class: 'statlist ty-live' }, [
        api.el('div', {}, ['WPM', wpmEl]),
        api.el('div', {}, ['正確率', accEl]),
        api.el('div', {}, ['完成', api.el('b', { id: 'tyDone', text: '0' })])
      ]);
      var doneEl = live.querySelector('#tyDone');

      stage.appendChild(api.el('div', { class: 'ty-wrap' }, [
        api.el('div', { class: 'faint center', style: { fontSize: '12px', letterSpacing: '.2em' }, text: 'user@cse:~$' }),
        targetEl,
        input,
        descEl,
        live
      ]));

      function paint() {
        var v = input.value;
        CSE.ui.clear(targetEl);
        var firstBad = -1;
        for (var i = 0; i < target.length; i++) {
          var ch = target.charAt(i);
          var cls = 'ch' + (ch === ' ' ? ' sp' : '');
          if (i < v.length) {
            if (v.charAt(i) === ch) cls += ' done';
            else { cls += ' err'; if (firstBad < 0) firstBad = i; }
          } else if (i === v.length) {
            cls += ' cur';
          }
          targetEl.appendChild(api.el('span', { class: cls, text: ch === ' ' ? '␣' : ch }));
        }
        if (v.length > target.length) {
          targetEl.appendChild(api.el('span', { class: 'ch err', text: '×'.repeat(v.length - target.length) }));
          if (firstBad < 0) firstBad = target.length;
        }
        if (firstBad >= 0) api.hint('有打錯的字，按退格鍵改掉', 'bad');
        else api.hint('');
      }

      function stats() {
        var mins = Math.max(0.05, (performance.now() - startAt) / 60000);
        wpmEl.textContent = String(Math.round((typedOK / 5) / mins));
        var tot = typedOK + errors;
        accEl.textContent = (tot ? Math.round((typedOK / tot) * 100) : 100) + '%';
        doneEl.textContent = String(done);
      }

      function nextCmd() {
        if (pi >= pool.length) pool = CSE.util.shuffle(CMDS), pi = 0;
        var item = pool[pi++];
        target = item[0];
        desc = item[1];
        input.value = '';
        prevLen = 0;
        descEl.innerHTML = '<b>' + CSE.ui.esc(target.split(' ')[0]) + '</b>　' + CSE.ui.esc(desc);
        paint();
        api.setStat('完成', done);
      }

      input.addEventListener('input', function () {
        var v = input.value;
        /* 只在「新增一個字」時判斷對錯，避免退格重複計算 */
        if (v.length === prevLen + 1) {
          var i = v.length - 1;
          if (i < target.length && v.charAt(i) === target.charAt(i)) {
            typedOK++;
            api.addScore(8);
            api.sfx.play('type');
          } else {
            errors++;
            api.sfx.play('bad');
          }
        }
        prevLen = v.length;
        paint();
        stats();
        if (v === target) {
          done++;
          api.addScore(60);
          api.sfx.play('ok');
          nextCmd();
          stats();
        }
      });

      /* 防作弊：不能貼上 */
      input.addEventListener('paste', function (e) {
        e.preventDefault();
        CSE.toast('這個遊戲不能貼上喔', 'bad');
      });
      /* 中文輸入法會讓字元進不來，提醒一次 */
      var warned = false;
      input.addEventListener('compositionstart', function () {
        if (warned) return;
        warned = true;
        CSE.toast('請切換成英數輸入法（Shift 或 Ctrl+Space）', 'bad', 3200);
      });
      /* 點畫面任何地方都把焦點送回輸入框（不用 blur 自動搶回，
         否則手機鍵盤會一直彈出來，也會搶走上方按鈕的焦點） */
      api.on(stage, 'click', function (e) {
        if (e.target.closest && e.target.closest('button, a')) return;
        input.focus();
      });
      /* 空白鍵不要把頁面往下捲 */
      api.on(window, 'keydown', function (e) {
        if (e.key === ' ' && document.activeElement !== input) e.preventDefault();
      });

      api.onResult(function () {
        var mins = Math.max(0.05, (performance.now() - startAt) / 60000);
        var tot = typedOK + errors;
        return {
          stats: [
            { k: '完成指令', v: done + ' 個' },
            { k: 'WPM', v: Math.round((typedOK / 5) / mins) },
            { k: '正確率', v: (tot ? Math.round((typedOK / tot) * 100) : 100) + '%' },
            { k: '打錯', v: errors + ' 次' }
          ]
        };
      });

      nextCmd();
      api.after(60, function () { input.focus(); });

      return {
        destroy: function () { try { input.blur(); } catch (e) { /* ignore */ } }
      };
    }
  });
})();

</script>
<script>
/* ===== assets/js/games/packet.js ===== */
/* ============================================================
   遊戲 6：封包路由 — 幫封包挑一條延遲最低的路
   教的是：網路拓撲、最短路徑（Dijkstra）、ping 的延遲是什麼
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;

  var LEVELS = [
    { cols: 3, rows: 2 },
    { cols: 4, rows: 2 },
    { cols: 4, rows: 3 },
    { cols: 5, rows: 3 },
    { cols: 5, rows: 3 }
  ];

  var W = 700, MARGIN = 58, ROW_H = 104;
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function buildGraph(cols, rows) {
    for (var attempt = 0; attempt < 80; attempt++) {
      var n = cols * rows;
      var H = MARGIN * 2 + (rows - 1) * ROW_H;
      var nodes = [];
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          nodes.push({
            id: nodes.length,
            name: LETTERS.charAt(nodes.length % 26),
            x: MARGIN + (cols === 1 ? 0 : c * (W - MARGIN * 2) / (cols - 1)) + CSE.util.randInt(-12, 12),
            y: MARGIN + (rows === 1 ? 0 : r * ROW_H) + CSE.util.randInt(-12, 12),
            c: c, r: r
          });
        }
      }
      var idx = function (c, r) { return r * cols + c; };
      var edges = [];
      function addEdge(a, b) {
        edges.push({ a: a, b: b, w: CSE.util.randInt(1, 9) });
      }
      for (var r2 = 0; r2 < rows; r2++) {
        for (var c2 = 0; c2 < cols; c2++) {
          if (c2 + 1 < cols && Math.random() > 0.15) addEdge(idx(c2, r2), idx(c2 + 1, r2));
          if (r2 + 1 < rows && Math.random() > 0.25) addEdge(idx(c2, r2), idx(c2, r2 + 1));
          if (c2 + 1 < cols && r2 + 1 < rows && Math.random() > 0.55) addEdge(idx(c2, r2), idx(c2 + 1, r2 + 1));
          if (c2 + 1 < cols && r2 - 1 >= 0 && Math.random() > 0.65) addEdge(idx(c2, r2), idx(c2 + 1, r2 - 1));
        }
      }

      var adj = nodes.map(function () { return []; });
      edges.forEach(function (e, i) {
        adj[e.a].push({ to: e.b, w: e.w, e: i });
        adj[e.b].push({ to: e.a, w: e.w, e: i });
      });

      /* 連通性檢查 */
      var seen = [0], stack = [0];
      var visited = new Array(n); visited[0] = true;
      while (stack.length) {
        var u = stack.pop();
        adj[u].forEach(function (x) {
          if (!visited[x.to]) { visited[x.to] = true; stack.push(x.to); seen.push(x.to); }
        });
      }
      if (seen.length !== n) continue;

      /* 起點在最左欄、終點在最右欄，且不能相鄰（否則一步就到） */
      var src = idx(0, CSE.util.randInt(0, rows - 1));
      var dst = idx(cols - 1, CSE.util.randInt(0, rows - 1));
      if (adj[src].some(function (x) { return x.to === dst; })) continue;

      var best = dijkstra(nodes.length, adj, src, dst);
      if (!best || best.path.length < 3) continue;

      return { nodes: nodes, edges: edges, adj: adj, src: src, dst: dst, best: best, w: W, h: H };
    }
    return null;
  }

  function dijkstra(n, adj, src, dst) {
    var INF = Infinity;
    var dist = new Array(n), prev = new Array(n), used = new Array(n);
    for (var i = 0; i < n; i++) { dist[i] = INF; prev[i] = -1; used[i] = false; }
    dist[src] = 0;
    for (var k = 0; k < n; k++) {
      var u = -1, bd = INF;
      for (var j = 0; j < n; j++) if (!used[j] && dist[j] < bd) { bd = dist[j]; u = j; }
      if (u < 0) break;
      used[u] = true;
      if (u === dst) break;
      for (var a = 0; a < adj[u].length; a++) {
        var e = adj[u][a];
        if (dist[u] + e.w < dist[e.to]) { dist[e.to] = dist[u] + e.w; prev[e.to] = u; }
      }
    }
    if (dist[dst] === INF) return null;
    var path = [], cur = dst;
    while (cur !== -1) { path.unshift(cur); cur = prev[cur]; }
    return { cost: dist[dst], path: path };
  }

  CSE.registerGame({
    id: 'packet',
    name: '封包路由',
    tag: '計算機網路 · ROUTING',
    icon: '⇄',
    accent: 'var(--pink)',
    blurb: '你按下 Enter 之後，資料要經過好幾台路由器。線上的數字是延遲，幫封包找出最快的路。',
    how: [
      '綠色是起點、紫色是目標，線上的數字是那一段的延遲（毫秒）。',
      '從起點開始，一台一台點相鄰的路由器接出路徑。',
      '點路徑上最後一台可以回退一步。',
      '走到目標後按「送出封包」。走到理論最短路徑有大獎，共 5 關。'
    ],
    controls: '點節點接路徑；點最後一個節點可回退',
    duration: 150,
    medals: { bronze: 700, silver: 1300, gold: 2000 },
    titles: ['體驗組', '見習網管', '路由達人', '網路架構師'],
    knowledge: {
      title: '你的封包真的在找最短路',
      lines: [
        '網路上的路由器會互相交換「我到哪裡要多久」，再用 Dijkstra 這類演算法算最短路徑。',
        'ping 顯示的毫秒數，就是封包來回一趟累加起來的延遲。',
        'traceroute 這個指令可以把封包實際經過的每一站印出來，你可以回家試試。',
        '同樣的最短路徑演算法也用在 Google Maps 導航、遊戲 AI 尋路上。'
      ]
    },

    mount: function (stage, api) {
      var li = 0;
      var G = null, path = [], locked = false, levelStart = 0;
      var perfect = 0, totalDiff = 0;
      var anim = null;

      var canvas = api.el('div', { class: 'pk-canvas' });
      var costEl = api.el('b', { text: '0' });
      var bestEl = api.el('b', { text: '?' });
      var btnSend = api.el('button', { type: 'button', class: 'btn btn--primary', text: '送出封包', disabled: true, onclick: send });
      var btnClear = api.el('button', { type: 'button', class: 'btn btn--sm', text: '重選路徑', onclick: function () {
        if (locked || !G) return;
        path = [G.src];
        api.sfx.play('click');
        render();
      } });

      stage.appendChild(api.el('div', { class: 'pk-wrap' }, [
        canvas,
        api.el('div', { class: 'statlist pk-info' }, [
          api.el('div', {}, ['目前延遲', costEl]),
          api.el('div', {}, ['最短可能', bestEl])
        ]),
        api.el('div', { class: 'row', style: { justifyContent: 'center' } }, [btnSend, btnClear])
      ]));

      function pathCost() {
        var sum = 0;
        for (var i = 1; i < path.length; i++) {
          var link = G.adj[path[i - 1]].filter(function (x) { return x.to === path[i]; })[0];
          if (link) sum += link.w;
        }
        return sum;
      }

      function edgeInPath(e) {
        for (var i = 1; i < path.length; i++) {
          if ((path[i - 1] === e.a && path[i] === e.b) || (path[i - 1] === e.b && path[i] === e.a)) return true;
        }
        return false;
      }
      function edgeInBest(e) {
        var bp = G.best.path;
        for (var i = 1; i < bp.length; i++) {
          if ((bp[i - 1] === e.a && bp[i] === e.b) || (bp[i - 1] === e.b && bp[i] === e.a)) return true;
        }
        return false;
      }

      var svgRef = null, pktRef = null;

      function render(showBest) {
        var last = path[path.length - 1];
        var reach = {};
        if (!locked) {
          G.adj[last].forEach(function (x) { if (path.indexOf(x.to) < 0) reach[x.to] = true; });
        }

        var svg = api.svg('svg', { viewBox: '0 0 ' + G.w + ' ' + Math.round(G.h), role: 'img', 'aria-label': '網路拓撲圖' });

        G.edges.forEach(function (e) {
          var A = G.nodes[e.a], B = G.nodes[e.b];
          var cls = 'edge' + (edgeInPath(e) ? ' used' : (showBest && edgeInBest(e) ? ' best' : ''));
          svg.appendChild(api.svg('line', { class: cls, x1: A.x, y1: A.y, x2: B.x, y2: B.y }));
        });
        G.edges.forEach(function (e) {
          var A = G.nodes[e.a], B = G.nodes[e.b];
          var mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
          svg.appendChild(api.svg('rect', { class: 'ew-bg', x: mx - 10, y: my - 9, width: 20, height: 18, rx: 4 }));
          svg.appendChild(api.svg('text', { class: 'ew', x: mx, y: my, text: String(e.w) }));
        });

        G.nodes.forEach(function (nd) {
          var cls = 'node';
          if (nd.id === G.src) cls += ' src';
          else if (nd.id === G.dst) cls += ' dst';
          if (path.indexOf(nd.id) >= 0) cls += ' path';
          if (reach[nd.id]) cls += ' reach';
          var g = api.svg('g', { class: cls, tabindex: locked ? null : '0', role: 'button',
            'aria-label': '路由器 ' + nd.name });
          g.appendChild(api.svg('circle', { cx: nd.x, cy: nd.y, r: 22 }));
          g.appendChild(api.svg('text', { x: nd.x, y: nd.y, text: nd.name }));
          if (nd.id === G.src) g.appendChild(api.svg('text', { class: 'ew', x: nd.x, y: nd.y - 34, text: '起點' }));
          if (nd.id === G.dst) g.appendChild(api.svg('text', { class: 'ew', x: nd.x, y: nd.y - 34, text: '目標' }));
          if (!locked) {
            g.addEventListener('click', function () { tap(nd.id); });
            g.addEventListener('keydown', function (ev) {
              if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); tap(nd.id); }
            });
          }
          svg.appendChild(g);
        });

        pktRef = api.svg('circle', { class: 'pkt', r: 7, cx: -50, cy: -50 });
        svg.appendChild(pktRef);

        CSE.ui.clear(canvas);
        canvas.appendChild(svg);
        svgRef = svg;

        var c = pathCost();
        costEl.textContent = String(c);
        bestEl.textContent = showBest ? String(G.best.cost) : '?';
        btnSend.disabled = locked || path[path.length - 1] !== G.dst;

        /* 死路提醒：沒有任何可以往前走的鄰居，又還沒到目標 */
        if (!locked && last !== G.dst && !Object.keys(reach).length) {
          api.hint('走進死路了 — 點路徑上任何一台可以退回去，或按「重選路徑」。', 'bad');
        }
      }

      function tap(id) {
        if (locked) return;
        var last = path[path.length - 1];
        /* 點路徑上的節點 = 退回那一步（點最後一台就是退一步） */
        var at = path.indexOf(id);
        if (at >= 0) {
          if (path.length === 1) return;
          path.length = (at === path.length - 1) ? at : at + 1;
          if (!path.length) path = [G.src];
          api.sfx.play('click');
          render();
          return;
        }
        var ok = G.adj[last].some(function (x) { return x.to === id; });
        if (!ok) {
          api.hint('路由器 ' + G.nodes[last].name + ' 和 ' + G.nodes[id].name + ' 之間沒有直接連線', 'bad');
          api.sfx.play('bad');
          return;
        }
        path.push(id);
        api.sfx.play('click');
        api.hint(path[path.length - 1] === G.dst ? '到目標了！可以送出封包' : '', 'good');
        render();
      }

      function send() {
        if (locked || path[path.length - 1] !== G.dst) return;
        locked = true;
        btnSend.disabled = true;
        var cost = pathCost();
        var diff = cost - G.best.cost;
        totalDiff += diff;

        /* 封包動畫 */
        var pts = path.map(function (i) { return G.nodes[i]; });
        anim = { pts: pts, seg: 0, t: 0 };

        api.after(Math.min(1400, 320 * (pts.length - 1) + 120), function () {
          anim = null;
          var spent = (performance.now() - levelStart) / 1000;
          var speed = Math.max(0, Math.round((22 - spent) * 5));
          var gain;
          if (diff === 0) { gain = 300 + speed + 100; perfect++; }
          else gain = Math.max(50, 300 - diff * 45) + Math.round(speed / 2);
          api.addScore(gain);
          api.sfx.play(diff === 0 ? 'great' : 'ok');
          api.hint(diff === 0
            ? '完美！延遲 ' + cost + ' ms 就是理論最短　+' + gain + ' 分'
            : '延遲 ' + cost + ' ms，最短是 ' + G.best.cost + ' ms（綠色虛線）　+' + gain + ' 分',
            diff === 0 ? 'good' : 'bad');
          render(true);

          li++;
          if (li >= LEVELS.length) {
            var bonus = Math.round(api.timeLeft() * 5);
            api.addScore(bonus);
            api.after(2000, function () {
              api.finish({
                reason: 'cleared',
                stats: [
                  { k: '完美路徑', v: perfect + ' / ' + LEVELS.length },
                  { k: '多繞', v: totalDiff + ' ms' },
                  { k: '剩餘時間加分', v: '+' + bonus }
                ]
              });
            });
          } else {
            api.after(2200, loadLevel);
          }
        });
      }

      function loadLevel() {
        var spec = LEVELS[li];
        G = buildGraph(spec.cols, spec.rows);
        if (!G) {   /* 極端情況產不出圖，退回最簡單的設定 */
          G = buildGraph(3, 2);
          if (!G) { api.hint('地圖產生失敗，請按重來', 'bad'); return; }
        }
        path = [G.src];
        locked = false;
        levelStart = performance.now();
        api.setStat('關卡', (li + 1) + '/' + LEVELS.length);
        api.hint('從綠色起點開始，一台一台點過去');
        render(false);
      }

      api.onResult(function () {
        return {
          stats: [
            { k: '完成關卡', v: li + ' / ' + LEVELS.length },
            { k: '完美路徑', v: perfect },
            { k: '總共多繞', v: totalDiff + ' ms' }
          ]
        };
      });

      loadLevel();

      return {
        onFrame: function (dt) {
          if (!anim || !pktRef) return;
          anim.t += dt * 3.2;
          while (anim.t >= 1 && anim.seg < anim.pts.length - 2) { anim.t -= 1; anim.seg++; }
          var a = anim.pts[anim.seg], b = anim.pts[Math.min(anim.seg + 1, anim.pts.length - 1)];
          var k = Math.min(1, anim.t);
          pktRef.setAttribute('cx', a.x + (b.x - a.x) * k);
          pktRef.setAttribute('cy', a.y + (b.y - a.y) * k);
        }
      };
    }
  });
})();

</script>

      q: '「Debug」這個說法，和早期電腦裡找到一隻蛾的故事有關',
      ans: true,
      say: '1947 年 Grace Hopper 團隊在 Mark II 電腦裡找到一隻飛蛾並記錄下來，讓「抓蟲 = 修錯」這個說法廣為流傳。'
    }
  ];

  var ROUND = 10, PER_Q = 10;

  CSE.registerGame({
    id: 'myth',
    name: '資工系大誤解',
    tag: '認識資工系 · MYTH',
    icon: '?!',
    accent: 'var(--pink)',
    blurb: '「資工系是不是在修電腦？」十題快問快答，三秒內判斷對錯，順手破解對資工系的誤會。',
    how: [
      '畫面出現一句關於資工系的話。',
      '判斷它是「對」還是「錯」，直接按大按鈕。',
      '每題 10 秒，越快答對分數越高，連對有加成。',
      '每題都有解說 — 答錯沒關係，看懂才是重點。'
    ],
    controls: '點按鈕；鍵盤左右方向鍵或 O / X 也可以',
    duration: 0,
    medals: { bronze: 700, silver: 1300, gold: 1900 },
    titles: ['路過的訪客', '略懂略懂', '資工系通', '系學會榮譽會員'],
    knowledge: {
      title: '所以資工系到底在幹嘛？',
      lines: [
        '一句話：學「如何用計算解決問題」，從 0 和 1 一路到 AI。',
        '必修大致是：程式設計 → 資料結構 → 演算法 → 計算機組織 → 作業系統 → 網路 → 資料庫。',
        '不需要先會寫程式，但需要願意花時間把一個東西想清楚。',
        '想了解更多可以到「關於資工系」看課程地圖。'
      ]
    },

    mount: function (stage, api) {
      var queue = CSE.util.shuffle(Q).slice(0, ROUND);
      var qi = -1, right = 0, wrong = 0, streak = 0, bestStreak = 0;
      var locked = true, qLeft = 0;

      var qEl = api.el('div', { class: 'my-q' });
      var barIn = api.el('i', { style: { width: '0%' } });
      var fb = api.el('div', { class: 'my-fb', text: '看完這句話，判斷它是對還是錯。' });
      var btnYes = api.el('button', {
        type: 'button', class: 'btn my-yes', onclick: function () { answer(true); }
      }, [api.el('span', { text: '○ 對' }), api.el('small', { text: 'TRUE' })]);
      var btnNo = api.el('button', {
        type: 'button', class: 'btn my-no', onclick: function () { answer(false); }
      }, [api.el('span', { text: '✕ 錯' }), api.el('small', { text: 'FALSE' })]);
      var nextBtn = api.el('button', {
        type: 'button', class: 'btn btn--primary hidden', text: '下一題',
        onclick: function () { api.sfx.play('click'); nextQ(); }
      });
      var counter = api.el('div', { class: 'faint center', style: { fontSize: '12px' }, text: '' });

      stage.appendChild(api.el('div', { class: 'my-wrap' }, [
        counter,
        api.el('div', { class: 'my-bar' }, barIn),
        qEl,
        api.el('div', { class: 'my-btns' }, [btnYes, btnNo]),
        fb,
        api.el('div', { class: 'row', style: { justifyContent: 'center' } }, [nextBtn])
      ]));

      function answer(said) {
        if (locked) return;
        locked = true;
        var item = queue[qi];
        var ok = (said === item.ans);
        btnYes.disabled = true;
        btnNo.disabled = true;
        nextBtn.classList.remove('hidden');

        if (ok) {
          right++; streak++;
          bestStreak = Math.max(bestStreak, streak);
          var speed = Math.max(0, Math.round(qLeft * 9));
          var gain = 100 + speed + 15 * Math.min(streak - 1, 6);
          api.addScore(gain);
          api.sfx.play(streak >= 3 ? 'great' : 'ok');
          fb.className = 'my-fb right';
          fb.innerHTML = '<span class="verdict">✓ 答對了（+' + gain + '）' +
            (streak > 1 ? '　' + streak + ' 連對' : '') + '</span>' + CSE.ui.esc(item.say);
        } else {
          wrong++; streak = 0;
          api.sfx.play('bad');
          fb.className = 'my-fb wrong';
          fb.innerHTML = '<span class="verdict">✕ 這句話其實是「' + (item.ans ? '對' : '錯') + '」的</span>' +
            CSE.ui.esc(item.say);
        }
        api.setStat('連對', streak);
      }

      function timeUp() {
        if (locked) return;
        locked = true;
        wrong++; streak = 0;
        btnYes.disabled = true;
        btnNo.disabled = true;
        nextBtn.classList.remove('hidden');
        api.sfx.play('bad');
        var item = queue[qi];
        fb.className = 'my-fb wrong';
        fb.innerHTML = '<span class="verdict">⏱ 時間到 — 答案是「' + (item.ans ? '對' : '錯') + '」</span>' +
          CSE.ui.esc(item.say);
        api.setStat('連對', 0);
      }

      function nextQ() {
        qi++;
        if (qi >= queue.length) {
          api.finish({
            reason: 'cleared',
            stats: [
              { k: '答對', v: right + ' / ' + queue.length },
              { k: '最高連對', v: bestStreak },
              { k: '正確率', v: Math.round(right / queue.length * 100) + '%' }
            ]
          });
          return;
        }
        locked = false;
        qLeft = PER_Q;
        btnYes.disabled = false;
        btnNo.disabled = false;
        nextBtn.classList.add('hidden');
        counter.textContent = '第 ' + (qi + 1) + ' / ' + queue.length + ' 題';
        qEl.textContent = '「' + queue[qi].q + '」';
        fb.className = 'my-fb';
        fb.textContent = '看完這句話，判斷它是對還是錯。';
        api.hint('');
      }

      api.on(document, 'keydown', function (e) {
        if (locked) {
          if (e.key === 'Enter' && !nextBtn.classList.contains('hidden')) { e.preventDefault(); nextQ(); }
          return;
        }
        var k = e.key.toLowerCase();
        if (k === 'arrowleft' || k === 'o' || k === '1') { e.preventDefault(); answer(true); }
        if (k === 'arrowright' || k === 'x' || k === '2') { e.preventDefault(); answer(false); }
      });

      api.onResult(function () {
        return {
          stats: [
            { k: '答對', v: right + ' 題' },
            { k: '答錯', v: wrong + ' 題' },
            { k: '最高連對', v: bestStreak }
          ]
        };
      });

      api.setStat('連對', 0);
      nextQ();

      /* 用 onTick（真實時鐘）而不是 onFrame（rAF）：
         視窗被蓋住時 rAF 可能完全不跑，每題倒數會卡住。 */
      return {
        onTick: function (dt) {
          if (locked) return;
          qLeft -= dt;
          barIn.style.width = Math.max(0, Math.min(100, (1 - qLeft / PER_Q) * 100)) + '%';
          if (qLeft <= 0) { qLeft = 0; timeUp(); }
        }
      };
    }
  });
})();

</script>
<script>
/* ===== assets/js/app.js ===== */
/* ============================================================
   app.js — 路由 / 首頁 / 排行榜 / 關於 / 設定 / 背景特效 / 展示模式
   ============================================================ */
(function () {
  'use strict';
  var CSE = window.CSE;
  var ui = CSE.ui, el = ui.el;
  var cfg = CSE.config;

  var view = document.getElementById('view');
  var navEl = document.getElementById('nav');
  var totalChip = document.getElementById('totalChip');

  /* 首頁卡片順序：先用「資工系大誤解」當開場，再往技術深處走 */
  var ORDER = ['myth', 'binary', 'bughunt', 'logic', 'sort', 'packet', 'typing'];
  function orderedGames() {
    var out = [];
    ORDER.forEach(function (id) { if (CSE.gameById[id]) out.push(CSE.gameById[id]); });
    CSE.games.forEach(function (g) { if (out.indexOf(g) < 0) out.push(g); });
    return out;
  }

  /* 每個頁面自己的清理工作（打字機、計時器…） */
  var pageCleanups = [];
  function onLeave(fn) { pageCleanups.push(fn); }
  function cleanPage() {
    var list = pageCleanups; pageCleanups = [];
    list.forEach(function (f) { try { f(); } catch (e) { /* ignore */ } });
  }

  /* ---------------- 背景矩陣雨 ---------------- */
  var rain = (function () {
    var cv = document.getElementById('bgfx');
    var ctx = cv.getContext ? cv.getContext('2d') : null;
    var cols = [], W = 0, H = 0, raf = 0, on = false, acc = 0;
    var GLYPHS = '01{}[]()<>/\\=+-*&|!?;:ABCDEF01'.split('');

    function resize() {
      if (!ctx) return;
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.floor(W * dpr);
      cv.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = '13px monospace';
      var n = Math.ceil(W / 18);
      cols = [];
      for (var i = 0; i < n; i++) cols.push(Math.random() * -H);
    }

    function step() {
      if (!on) return;
      raf = requestAnimationFrame(step);
      acc++;
      if (acc % 2) return;                     /* 降到約 30fps，省電 */
      ctx.fillStyle = 'rgba(6,10,15,0.10)';
      ctx.fillRect(0, 0, W, H);
      for (var i = 0; i < cols.length; i++) {
        var y = cols[i];
        var x = i * 18 + 3;
        ctx.fillStyle = 'rgba(57,255,136,0.82)';
        ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], x, y);
        ctx.fillStyle = 'rgba(56,217,255,0.22)';
        ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], x, y - 17);
        cols[i] = y > H + Math.random() * 400 ? 0 : y + 17;
      }
    }

    return {
      start: function () {
        if (!ctx || on || !CSE.settings.get('motion')) return;
        on = true; resize(); step();
      },
      stop: function () {
        on = false;
        cancelAnimationFrame(raf);
        if (ctx) ctx.clearRect(0, 0, W, H);
      },
      resize: function () { if (on) resize(); }
    };
  })();

  window.addEventListener('resize', function () { rain.resize(); });

  /* ---------------- 打字機 ---------------- */
  function typewriter(target, lines, done) {
    if (!CSE.settings.get('motion')) {
      lines.forEach(function (t) { target.appendChild(el('div', { html: t })); });
      if (done) done();
      return function () {};
    }
    var li = 0, ci = 0, cur = null, timer = 0, stopped = false;
    var plain = lines.map(function (t) { return t.replace(/<[^>]*>/g, ''); });
    function tick() {
      if (stopped) return;
      if (li >= lines.length) { if (done) done(); return; }
      if (!cur) { cur = el('div', {}); target.appendChild(cur); }
      ci++;
      cur.textContent = plain[li].slice(0, ci);
      if (ci >= plain[li].length) {
        cur.innerHTML = lines[li];     /* 打完這行才換成帶標記的版本 */
        li++; ci = 0; cur = null;
        timer = setTimeout(tick, 220);
      } else {
        timer = setTimeout(tick, 16);
      }
    }
    tick();
    return function () { stopped = true; clearTimeout(timer); };
  }

  /* ---------------- 首頁 ---------------- */
  function screenHome() {
    rain.start();
    var total = CSE.scores.total();
    var played = CSE.games.filter(function (g) { return CSE.scores.plays(g.id) > 0; }).length;
    var badges = CSE.scores.badges().filter(function (b) { return b.got; }).length;

    var termBody = el('div', { class: 'term-body' });
    var hero = el('div', { class: 'hero' }, el('div', { class: 'term' }, [
      el('div', { class: 'term-bar' }, [
        el('i', { class: 'term-dot r' }), el('i', { class: 'term-dot y' }), el('i', { class: 'term-dot g' }),
        el('span', { text: 'iecs-arcade — bash — 80×24' })
      ]),
      termBody
    ]));

    var typedBox = el('div', { class: 'faint', style: { fontSize: '13px', marginBottom: '10px' } });
    termBody.appendChild(typedBox);
    var stop = typewriter(typedBox, [
      '<span class="prompt">whoami</span>',
      '<span style="color:var(--green)">' + ui.esc(cfg.school + ' ' + cfg.dept) + '</span>',
      '<span class="prompt">./start-arcade.sh</span>'
    ], function () {
      termBody.appendChild(el('h1', { text: cfg.title }));
      termBody.appendChild(el('p', { class: 'hero-sub', text: cfg.tagline }));
      termBody.appendChild(el('div', { class: 'hero-stats' }, [
        el('div', { class: 'hero-stat' }, [el('b', { text: CSE.util.nf(total) }), el('span', { text: '你的總分' })]),
        el('div', { class: 'hero-stat' }, [el('b', { text: played + ' / ' + CSE.games.length }), el('span', { text: '玩過的遊戲' })]),
        el('div', { class: 'hero-stat' }, [el('b', { text: String(badges) }), el('span', { text: '拿到的徽章' })])
      ]));
    });
    onLeave(stop);

    var cards = el('div', { class: 'grid-games' });
    /* 都沒玩過的人，第一張卡標成「推薦先玩」，給一個明確的起點 */
    var firstTime = CSE.scores.totalPlays() === 0;
    orderedGames().forEach(function (g, gi) {
      var best = CSE.scores.best(g.id);
      var medal = CSE.scores.medalOf(g.id, best);
      var pick = firstTime && gi === 0;
      var card = el('button', {
        type: 'button',
        class: 'gcard' + (pick ? ' gcard--pick' : ''),
        style: { '--accent': g.accent || 'var(--green)' }
      }, [
        pick ? el('span', { class: 'gcard-pick', text: '推薦先玩' }) : null,
        el('div', { class: 'gcard-top' }, [
          el('div', { class: 'gcard-icon', html: g.icon || '#' }),
          el('div', {}, [
            el('div', { class: 'gcard-name', text: g.name }),
            el('div', { class: 'gcard-tag', text: g.tag || '' })
          ])
        ]),
        el('div', { class: 'gcard-blurb', text: g.blurb }),
        el('div', { class: 'gcard-foot' }, [
          el('span', { class: 'gcard-best', html: best ? ('最佳 <b>' + CSE.util.nf(best) + '</b>') : '還沒玩過' }),
          el('span', { class: 'medal', text: medal ? CSE.scores.medalIcon(medal) : (g.duration ? g.duration + ' 秒' : '10 題') })
        ])
      ]);
      card.style.setProperty('--accent', g.accent || 'var(--green)');
      card.addEventListener('click', function () {
        CSE.sfx.unlock();
        CSE.sfx.play('click');
        location.hash = '#/g/' + g.id;
      });
      cards.appendChild(card);
    });

    var blocks = [hero];

    /* 挑戰目標（舊版叫 prize，為了舊設定檔還能用，兩個名字都接受） */
    var goal = cfg.goal || cfg.prize;
    if (goal && goal.enabled) {
      var reached = total >= goal.threshold;
      var lines = [el('b', { text: reached ? '🎉 挑戰完成！' : goal.text })];
      lines.push(el('div', { class: 'faint', style: { fontSize: '12px' } },
        reached
          ? '你的總分 ' + CSE.util.nf(total) + ' 分，已經超過 ' + CSE.util.nf(goal.threshold) + ' 分。'
          : '目前 ' + CSE.util.nf(total) + ' / ' + CSE.util.nf(goal.threshold) +
            ' 分，還差 ' + CSE.util.nf(goal.threshold - total) + ' 分' +
            '　·　總分 = 七款各自的最佳分數加總，七款都玩過最快'));
      if (goal.reward && String(goal.reward).trim()) {
        lines.push(el('div', {
          style: { fontSize: '12.5px', marginTop: '4px', color: 'var(--amber)' },
          text: '🎁 ' + goal.reward
        }));
      }
      blocks.push(el('div', { class: 'notice' }, [
        el('span', { class: 'ic', text: reached ? '🎉' : '◆' }),
        el('div', {}, lines)
      ]));
    }

    blocks.push(cards);

    /* 徽章 */
    var bg = el('div', { class: 'badges' }, CSE.scores.badges().map(function (b) {
      return el('div', { class: 'badge' + (b.got ? '' : ' off') }, [
        el('span', { class: 'bi', text: b.icon }),
        el('div', {}, [el('b', { text: b.name }), el('span', { text: b.note })])
      ]);
    }));
    blocks.push(el('div', { class: 'panel' }, [
      ui.corners(),
      el('div', { class: 'kicker', text: 'ACHIEVEMENTS' }),
      el('h2', { text: '關卡護照' }),
      el('p', { class: 'muted', style: { fontSize: '13px' }, text: '每款遊戲達到分數門檻就能拿到銅、銀、金牌。七款全破看看會發生什麼事。' }),
      bg
    ]));

    ui.clear(view);
    ui.append(view, blocks);
  }

  /* ---------------- 遊戲頁 ---------------- */
  function screenGame(id) {
    rain.stop();
    var def = CSE.gameById[id];
    if (!def) { CSE.toast('找不到這個遊戲', 'bad'); location.hash = '#/'; return; }
    ui.clear(view);
    var mount = el('div', {});
    view.appendChild(mount);
    CSE.host.start(def, mount);
  }

  /* ---------------- 排行榜 ---------------- */
  function screenBoard(params) {
    rain.stop();
    var games = orderedGames();
    var active = params.g && CSE.gameById[params.g] ? params.g : games[0].id;

    var tabs = el('div', { class: 'lb-tabs' });
    var tableBox = el('div', {});

    function paint() {
      var g = CSE.gameById[active];
      var rows = CSE.scores.top(active, 10);
      ui.clear(tableBox);
      tableBox.appendChild(el('div', { class: 'row spread', style: { marginBottom: '10px' } }, [
        el('div', {}, [
          el('div', { class: 'kicker', text: g.tag || '' }),
          el('h2', { text: g.name + ' 排行榜' })
        ]),
        el('a', { class: 'btn btn--sm', href: '#/g/' + g.id, text: '挑戰這款' })
      ]));
      if (!rows.length) {
        tableBox.appendChild(el('div', { class: 'empty', text: '還沒有人登錄成績，來當第一個。' }));
      } else {
        tableBox.appendChild(el('table', { class: 'data' }, [
          el('thead', {}, el('tr', {}, [
            el('th', { text: '#' }), el('th', { text: '暱稱' }),
            el('th', { style: { textAlign: 'right' }, text: '分數' }),
            el('th', { style: { textAlign: 'right' }, text: '時間' })
          ])),
          el('tbody', {}, rows.map(function (r, i) {
            var d = new Date(r.t);
            return el('tr', {}, [
              el('td', { class: 'rk', text: String(i + 1) }),
              el('td', { text: r.n }),
              el('td', { class: 'n', text: CSE.util.nf(r.s) }),
              el('td', { class: 'faint', style: { textAlign: 'right', fontSize: '12px' },
                text: CSE.util.pad(d.getHours(), 2) + ':' + CSE.util.pad(d.getMinutes(), 2) })
            ]);
          }))
        ]));
      }
      Array.prototype.forEach.call(tabs.children, function (b) {
        b.setAttribute('aria-current', b.dataset.id === active ? 'page' : 'false');
        b.className = 'btn btn--sm' + (b.dataset.id === active ? ' btn--primary' : '');
      });
    }

    games.forEach(function (g) {
      var b = el('button', { type: 'button', class: 'btn btn--sm', text: g.name, dataset: { id: g.id } });
      b.addEventListener('click', function () {
        active = g.id;
        CSE.sfx.play('click');
        paint();
      });
      tabs.appendChild(b);
    });

    var sum = CSE.scores.summary();
    var overview = el('div', { class: 'panel', style: { marginTop: 'var(--gap)' } }, [
      ui.corners(),
      el('div', { class: 'kicker', text: 'YOUR STATS' }),
      el('h2', { text: '遊戲統計' }),
      el('p', { class: 'muted', style: { fontSize: '13px' },
        text: '這些數字只存在這台裝置上，不會上傳。可以到「設定」匯出 CSV。' }),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', { text: '遊戲' }),
          el('th', { style: { textAlign: 'right' }, text: '遊玩次數' }),
          el('th', { style: { textAlign: 'right' }, text: '登錄筆數' }),
          el('th', { style: { textAlign: 'right' }, text: '最高分' })
        ])),
        el('tbody', {}, sum.map(function (s) {
          return el('tr', {}, [
            el('td', { text: s.name }),
            el('td', { class: 'n', text: String(s.plays) }),
            el('td', { class: 'n', text: String(s.entries) }),
            /* 沒人登錄暱稱時顯示破折號，避免看起來像「玩了但得 0 分」 */
            el('td', { class: 'n', text: s.entries ? CSE.util.nf(s.best) : '—' })
          ]);
        }))
      ])
    ]);

    ui.clear(view);
    ui.append(view, [
      el('div', { class: 'panel' }, [ui.corners(), tabs, tableBox]),
      overview
    ]);
    paint();
  }

  /* ---------------- 關於資工系 ---------------- */

  /* config.links 裡有填的才長出按鈕；要加新平台就在這個表加一行 */
  var LINK_LABELS = [
    ['ig_assoc', '系學會 IG'],
    ['web', '系網站'],
    ['ig', '系上 IG'],
    ['fb', 'Facebook'],
    ['threads', 'Threads'],
    ['line', 'LINE 社群']
  ];
  function linkButtons() {
    var links = cfg.links || {};
    return LINK_LABELS.filter(function (pair) {
      return typeof links[pair[0]] === 'string' && links[pair[0]].trim();
    }).map(function (pair) {
      return el('a', {
        class: 'btn', href: links[pair[0]].trim(),
        target: '_blank', rel: 'noopener noreferrer', text: pair[1]
      });
    });
  }

  function screenAbout() {
    rain.stop();
    var a = cfg.about;
    ui.clear(view);
    ui.append(view, [
      el('div', { class: 'panel' }, [
        ui.corners(),
        el('div', { class: 'kicker', text: 'ABOUT' }),
        el('h1', { text: cfg.dept + '　在學什麼？' }),
        el('p', { class: 'muted', style: { maxWidth: '68ch' }, text: a.intro })
      ]),
      el('div', { class: 'about-grid', style: { marginTop: 'var(--gap)' } }, [
        el('div', { class: 'panel' }, [
          ui.corners(),
          el('h2', { text: '◆ 核心課程' }),
          el('ul', {}, a.courses.map(function (c) {
            return el('li', {}, [el('b', { style: { color: 'var(--green)' }, text: c[0] }), '　' + c[1]]);
          }))
        ]),
        el('div', { class: 'panel' }, [
          ui.corners(),
          el('h2', { text: '◆ 畢業之後' }),
          el('ul', {}, a.careers.map(function (c) {
            return el('li', {}, [el('b', { style: { color: 'var(--cyan)' }, text: c[0] }), '　' + c[1]]);
          }))
        ])
      ]),
      el('div', { class: 'panel', style: { marginTop: 'var(--gap)' } }, [
        ui.corners(),
        el('h2', { text: '◆ 想先知道的四件事' }),
        el('ul', {}, a.myths.map(function (m) { return el('li', { text: m }); })),
        el('div', { class: 'divider' }),
        el('div', { class: 'row' }, [
          el('a', { class: 'btn btn--primary', href: '#/g/myth', text: '來玩「資工系大誤解」' })
        ].concat(linkButtons()))
      ])
    ]);
  }

  /* ---------------- 設定 ---------------- */
  function screenSettings() {
    rain.stop();
    function toggleRow(key, title, note) {
      var btn = el('button', {
        type: 'button', class: 'toggle', 'aria-pressed': CSE.settings.get(key) ? 'true' : 'false',
        'aria-label': title
      });
      btn.addEventListener('click', function () {
        var v = CSE.settings.toggle(key);
        btn.setAttribute('aria-pressed', v ? 'true' : 'false');
        CSE.sfx.play('click');
        /* 背景動畫的開關由 CSE.settings.onchange 統一處理 */
      });
      return el('div', { class: 'setrow' }, [
        el('div', { class: 't' }, [el('b', { text: title }), el('span', { text: note })]),
        btn
      ]);
    }

    var idleInput = el('input', {
      type: 'number', min: '20', max: '600', value: String(CSE.settings.get('idle')),
      style: { width: '96px' }
    });
    idleInput.addEventListener('change', function () {
      var v = CSE.util.clamp(parseInt(idleInput.value, 10) || 75, 20, 600);
      idleInput.value = String(v);
      CSE.settings.set('idle', v);
      CSE.toast('閒置時間設為 ' + v + ' 秒', 'ok');
    });

    ui.clear(view);
    ui.append(view, [
      el('div', { class: 'panel' }, [
        ui.corners(),
        el('div', { class: 'kicker', text: 'SETTINGS' }),
        el('h1', { text: '設定' }),
        el('p', { class: 'muted', style: { fontSize: '13px' },
          text: '你的分數和設定只存在這台裝置的瀏覽器裡，不會上傳到任何地方。' }),
        CSE.store.ok ? null : el('div', { class: 'notice' }, [
          el('span', { class: 'ic', text: '!' }),
          el('div', { text: '這個瀏覽器不允許存資料（可能是無痕模式），分數在重新整理後會消失，但遊戲照常可以玩。' })
        ]),
        toggleRow('sound', '音效', '環境吵或不想發出聲音時可以關掉'),
        toggleRow('motion', '背景動畫', '關掉可以讓舊電腦跑更順、也比較省電'),
        toggleRow('scanline', 'CRT 掃描線', '復古濾鏡，看不習慣可以關'),
        toggleRow('kiosk', '展示模式（閒置自動回首頁）', '一段時間沒人操作就回到首頁，適合多人輪流共用的裝置'),
        el('div', { class: 'setrow' }, [
          el('div', { class: 't' }, [
            el('b', { text: '閒置秒數' }),
            el('span', { text: '展示模式下，多久沒人操作就回首頁' })
          ]),
          idleInput
        ])
      ]),
      el('div', { class: 'panel', style: { marginTop: 'var(--gap)' } }, [
        ui.corners(),
        el('h2', { text: '◆ 你的資料' }),
        el('p', { class: 'muted', style: { fontSize: '13px' },
          text: '排行榜可以匯出成 CSV（Excel 直接開得起來）。清除之後就救不回來了，' +
                '要留紀錄請先匯出。' }),
        el('div', { class: 'row' }, [
          el('button', {
            type: 'button', class: 'btn btn--primary', text: '匯出排行榜 CSV',
            onclick: function () {
              var d = new Date();
              var name = 'iecs-arcade-' + d.getFullYear() + CSE.util.pad(d.getMonth() + 1, 2) +
                CSE.util.pad(d.getDate(), 2) + '-' + CSE.util.pad(d.getHours(), 2) + CSE.util.pad(d.getMinutes(), 2) + '.csv';
              if (CSE.download(name, CSE.scores.exportCsv(), 'text/csv')) CSE.toast('已匯出 ' + name, 'ok');
            }
          }),
          el('button', {
            type: 'button', class: 'btn', text: '全螢幕',
            onclick: function () { toggleFullscreen(); }
          }),
          el('button', {
            type: 'button', class: 'btn btn--danger', text: '清除所有分數與設定',
            onclick: function () {
              CSE.confirm('確定要清除嗎？',
                '所有排行榜、個人最佳與徽章都會消失，而且無法復原。建議先匯出 CSV。',
                function () {
                  CSE.scores.resetAll();
                  CSE.settings.apply();
                  CSE.toast('已清除所有資料', 'ok');
                  refreshChrome();
                  location.hash = '#/';
                }, '清除');
            }
          })
        ])
      ]),
      el('div', { class: 'panel', style: { marginTop: 'var(--gap)' } }, [
        ui.corners(),
        el('h2', { text: '◆ 幾件可能想知道的事' }),
        el('ul', {}, [
          '排行榜是「這台裝置」的紀錄，不會跟別人共用，也不會上傳。換一台裝置就是全新的。',
          '按 F11 或右上角 ⛶ 進全螢幕，玩起來比較專心。',
          '多人輪流用同一台時，打開「展示模式」，沒人操作就會自動回首頁。',
          '整個網站不需要網路也能跑，完全沒有廣告和追蹤。'
        ].map(function (t) { return el('li', { class: 'muted', style: { fontSize: '13px', marginBottom: '6px' }, text: t }); }))
      ])
    ]);
  }

  /* ---------------- 全螢幕 ---------------- */
  function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        var p = document.documentElement.requestFullscreen &&
          document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () { CSE.toast('瀏覽器不允許全螢幕，請按 F11', 'bad'); });
      } else {
        document.exitFullscreen();
      }
    } catch (e) { CSE.toast('請改按鍵盤 F11 切換全螢幕', 'bad'); }
  }

  /* ---------------- 頂列狀態 ---------------- */
  function refreshChrome() {
    totalChip.querySelector('b').textContent = CSE.util.nf(CSE.scores.total());
  }

  /* ---------------- 導覽列 ----------------
     七款遊戲全部塞進橫列會超出畫面，而桌機用滑鼠滑不動橫向捲動區，
     等於後面的連結碰不到。改成：少數常用連結留在列上，
     遊戲收進一個下拉面板，窄螢幕則整個收成 ☰。 */

  var gamesBtn = null;     /* 桌機的「遊戲 ▾」按鈕 */
  var hamBtn = null;       /* 窄螢幕的 ☰ */
  var panel = null;        /* 開著的選單面板 */

  var FLAT_LINKS = [
    { href: '#/', label: '首頁' },
    { href: '#/board', label: '排行榜' },
    { href: '#/about', label: '關於資工系', wide: true }
  ];

  function buildNav() {
    ui.clear(navEl);

    navEl.appendChild(el('a', {
      class: 'navlink', href: '#/', text: '首頁', dataset: { route: '#/' }
    }));

    gamesBtn = el('button', {
      type: 'button', class: 'navlink navbtn', 'aria-expanded': 'false',
      'aria-haspopup': 'true',
      onclick: function (e) { e.stopPropagation(); togglePanel(); }
    }, [el('span', { class: 'navbtn-label', text: '遊戲' }), el('i', { class: 'caret', text: '▾' })]);
    navEl.appendChild(gamesBtn);

    navEl.appendChild(el('a', {
      class: 'navlink', href: '#/board', text: '排行榜', dataset: { route: '#/board' }
    }));
    navEl.appendChild(el('a', {
      class: 'navlink navlink--wide', href: '#/about', text: '關於資工系',
      dataset: { route: '#/about' }
    }));

    /* 窄螢幕的漢堡鈕，放在右側控制區最前面 */
    hamBtn = el('button', {
      type: 'button', class: 'iconbtn navham', 'aria-expanded': 'false',
      'aria-label': '選單', title: '選單', text: '☰',
      onclick: function (e) { e.stopPropagation(); togglePanel(); }
    });
    var right = document.querySelector('.topright');
    right.insertBefore(hamBtn, right.firstChild);
  }

  function closePanel() {
    if (!panel) return;
    if (panel.parentNode) panel.parentNode.removeChild(panel);
    panel = null;
    if (gamesBtn) gamesBtn.setAttribute('aria-expanded', 'false');
    if (hamBtn) hamBtn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onPanelKey, true);
    document.removeEventListener('click', onOutside, true);
  }

  function onPanelKey(e) {
    if (e.key === 'Escape') { e.stopPropagation(); closePanel(); }
  }
  function onOutside(e) {
    if (panel && !panel.contains(e.target) &&
        e.target !== gamesBtn && !gamesBtn.contains(e.target) &&
        e.target !== hamBtn) closePanel();
  }

  function togglePanel() {
    if (panel) { closePanel(); return; }
    CSE.sfx.play('click');

    var hash = location.hash || '#/';
    var grid = el('div', { class: 'navpanel-grid' });
    orderedGames().forEach(function (g) {
      var href = '#/g/' + g.id;
      var best = CSE.scores.best(g.id);
      var item = el('a', {
        class: 'navitem' + (hash.indexOf(href) === 0 ? ' navitem--now' : ''),
        href: href, style: { '--accent': g.accent || 'var(--green)' },
        onclick: function () { closePanel(); }
      }, [
        el('span', { class: 'navitem-ic', html: g.icon || '#' }),
        el('span', { class: 'navitem-txt' }, [
          el('b', { text: g.name }),
          el('span', { text: best ? '最佳 ' + CSE.util.nf(best) : '還沒玩過' })
        ])
      ]);
      grid.appendChild(item);
    });

    var others = el('div', { class: 'navpanel-links' },
      FLAT_LINKS.concat([{ href: '#/settings', label: '設定' }]).map(function (l) {
        return el('a', {
          class: 'navlink' + (hash === l.href ? ' navlink--now' : ''),
          href: l.href, text: l.label,
          onclick: function () { closePanel(); }
        });
      }));

    panel = el('div', { class: 'navpanel', role: 'menu' }, [
      el('div', { class: 'navpanel-head', text: '七款小遊戲' }),
      grid,
      el('div', { class: 'navpanel-head', text: '其他' }),
      others
    ]);
    panel.addEventListener('click', function (e) { e.stopPropagation(); });

    document.querySelector('.topbar').appendChild(panel);
    if (gamesBtn) gamesBtn.setAttribute('aria-expanded', 'true');
    if (hamBtn) hamBtn.setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', onPanelKey, true);
    /* 延後一拍再掛，免得開啟這一次的 click 立刻把它關掉 */
    setTimeout(function () { document.addEventListener('click', onOutside, true); }, 0);
  }

  function markNav(route) {
    closePanel();
    Array.prototype.forEach.call(navEl.children, function (a) {
      if (a.dataset && a.dataset.route === route) a.setAttribute('aria-current', 'page');
      else if (a.dataset) a.removeAttribute('aria-current');
    });
    /* 在遊戲頁時，按鈕直接顯示目前玩的是哪一款，不用再猜自己在哪 */
    if (!gamesBtn) return;
    var inGame = route.indexOf('#/g/') === 0;
    var g = inGame ? CSE.gameById[route.slice(4)] : null;
    gamesBtn.querySelector('.navbtn-label').textContent = g ? g.name : '遊戲';
    if (inGame) gamesBtn.setAttribute('aria-current', 'page');
    else gamesBtn.removeAttribute('aria-current');
  }

  /* ---------------- 路由 ---------------- */
  function parseHash() {
    var h = location.hash.replace(/^#/, '') || '/';
    var qi = h.indexOf('?');
    var params = {};
    if (qi >= 0) {
      h.slice(qi + 1).split('&').forEach(function (kv) {
        var p = kv.split('=');
        params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
      h = h.slice(0, qi);
    }
    return { path: h, params: params };
  }

  function route() {
    cleanPage();
    CSE.host.stop();
    var r = parseHash();
    var parts = r.path.split('/').filter(Boolean);

    refreshChrome();
    window.scrollTo(0, 0);

    if (parts[0] === 'g' && parts[1]) { markNav('#/g/' + parts[1]); screenGame(parts[1]); }
    else if (parts[0] === 'board') { markNav('#/board'); screenBoard(r.params); }
    else if (parts[0] === 'about') { markNav('#/about'); screenAbout(); }
    else if (parts[0] === 'settings') { markNav('#/settings'); screenSettings(); }
    else { markNav('#/'); screenHome(); }

    view.focus({ preventScroll: true });
  }

  /* ---------------- 展示模式：閒置回首頁 ---------------- */
  var idleTimer = 0;
  var attractEl = null;
  var lastInput = Date.now();

  function showAttract() {
    if (attractEl) return;
    attractEl = el('div', { class: 'attract', role: 'button', tabindex: '0',
      'aria-label': '點擊開始' }, el('div', {}, [
      el('div', { class: 'big', text: '點一下開始' }),
      el('div', { class: 'sm', text: cfg.title + '　·　' + cfg.tagline })
    ]));
    function go() {
      if (attractEl && attractEl.parentNode) attractEl.parentNode.removeChild(attractEl);
      attractEl = null;
      CSE.sfx.unlock();
      resetIdle();
    }
    attractEl.addEventListener('click', go);
    attractEl.addEventListener('keydown', go);
    document.body.appendChild(attractEl);
  }

  /* ---------------- 自動更新偵測 ----------------
     GitHub Pages 把 index.html 也快取 10 分鐘，所以推了新版之後，
     開著不動的裝置會一直停在舊版（連資產的 ?v= 都是舊的）。
     這裡讓網頁自己去比對版本，發現有新版就重新整理一次。
     只在沒人正在玩的時候做，而且每個版本只重載一次，不會無限迴圈。 */
  function checkForUpdate() {
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    var mine = document.documentElement.dataset.build;
    if (!mine || typeof fetch !== 'function') return;

    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.v || d.v === mine) return;
        if (CSE.host.busy) return;                  /* 有人正在玩就先不要動 */
        var key = 'cse.reloadedFor.' + d.v;
        try {
          if (sessionStorage.getItem(key)) return;  /* 這個版本已經重載過了 */
          sessionStorage.setItem(key, '1');
        } catch (e) { return; }                     /* 存不了就不要冒險重載 */
        location.reload();
      })
      .catch(function () { /* 離線或沒有 version.json，忽略 */ });
  }

  function resetIdle() {
    clearTimeout(idleTimer);
    if (!CSE.settings.get('kiosk')) return;
    var secs = CSE.settings.get('idle') || 75;
    idleTimer = setTimeout(function () {
      /* 正在玩就不要打斷 —— 但如果連「正在玩」都已經很久沒人碰，
         代表玩家中途走掉了（例如關卡制遊戲沒有倒數，會一直停在那裡）。
         這種情況還是要回首頁，否則下一位訪客會看到別人玩到一半的畫面。 */
      if (CSE.host.busy && (Date.now() - lastInput) < secs * 2000) {
        resetIdle();
        return;
      }
      CSE.host.stop();
      if (location.hash !== '#/' && location.hash !== '' && location.hash !== '#') location.hash = '#/';
      showAttract();
      checkForUpdate();   /* 沒人在用的空檔，順便確認有沒有新版 */
    }, secs * 1000);
  }

  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (t) {
    window.addEventListener(t, function () {
      lastInput = Date.now();
      if (attractEl) return;
      resetIdle();
    }, { passive: true });
  });

  CSE.settings.onchange = function (k) {
    if (k === 'kiosk' || k === 'idle') resetIdle();
    if (k === 'motion') {
      if (CSE.settings.get('motion') && location.hash.indexOf('/g/') < 0) rain.start();
      else rain.stop();
    }
  };

  /* ---------------- 啟動 ---------------- */
  function boot() {
    /* 版面文字 */
    document.title = cfg.title + ' · ' + cfg.booth;
    document.getElementById('brandTitle').textContent = cfg.title;
    document.getElementById('brandSub').textContent = cfg.booth;
    document.getElementById('footText').textContent = cfg.school + ' ' + cfg.dept + '　·　' + cfg.booth;

    CSE.settings.apply();
    buildNav();
    refreshChrome();

    document.getElementById('btnSound').addEventListener('click', function () {
      var v = CSE.settings.toggle('sound');
      CSE.sfx.unlock();
      if (v) CSE.sfx.play('ok');
      CSE.toast(v ? '音效開啟' : '音效關閉');
    });
    document.getElementById('btnFull').addEventListener('click', toggleFullscreen);

    /* 第一次互動解鎖音訊（瀏覽器政策） */
    window.addEventListener('pointerdown', function once() {
      CSE.sfx.unlock();
      window.removeEventListener('pointerdown', once);
    }, { once: true });

    CSE.host.onFinish = function () { refreshChrome(); };

    window.addEventListener('hashchange', route);
    route();
    resetIdle();

    /* 開啟時先確認一次，之後每 10 分鐘在沒人玩的時候再確認 */
    checkForUpdate();
    setInterval(function () { if (!CSE.host.busy) checkForUpdate(); }, 10 * 60 * 1000);

    if (CSE.games.length !== 7) {
      console.warn('[CSE] 載入了 ' + CSE.games.length + ' 款遊戲（預期 7 款），請檢查 index.html 的 script 標籤');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
